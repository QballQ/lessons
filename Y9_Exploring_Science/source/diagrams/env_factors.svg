<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><rect x="0" y="0" width="1600" height="820" fill="#FFFFFF"/><text x="800" y="70" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Environmental factors: things in the surroundings that can change an organism</text><rect x="80" y="150" width="680" height="560" rx="12" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="420.0" y="328.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="normal" fill="#141B26"></text><text x="420.0" y="365.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="normal" fill="#141B26"></text><text x="420.0" y="403.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="normal" fill="#141B26">temperature</text><text x="420.0" y="440.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="normal" fill="#141B26">amount of light</text><text x="420.0" y="478.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="normal" fill="#141B26">water and rainfall</text><text x="420.0" y="515.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="normal" fill="#141B26">mineral salts in the soil</text><text x="420.0" y="553.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="normal" fill="#141B26">wind</text><text x="420" y="215" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="40" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Abiotic (physical) factors</text><rect x="840" y="150" width="680" height="560" rx="12" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><text x="1180.0" y="328.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="normal" fill="#141B26"></text><text x="1180.0" y="365.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="normal" fill="#141B26"></text><text x="1180.0" y="403.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="normal" fill="#141B26">competition</text><text x="1180.0" y="440.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="normal" fill="#141B26">predation</text><text x="1180.0" y="478.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="normal" fill="#141B26">infectious disease</text><text x="1180.0" y="515.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="normal" fill="#141B26">the activities of people</text><text x="1180.0" y="553.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="normal" fill="#141B26">(e.g. fashion, farming)</text><text x="1180" y="215" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="40" text-anchor="middle" font-weight="bold" fill="#7B3A8E">Biotic factors</text><text x="420" y="760" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#5B6574" font-style="italic">non-living</text><text x="1180" y="760" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#5B6574" font-style="italic">caused by other living organisms</text></svg>