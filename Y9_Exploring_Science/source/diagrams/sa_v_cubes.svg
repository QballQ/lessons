<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><rect x="0" y="0" width="1600" height="760" fill="#FFFFFF"/><text x="800" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Surface area : volume ratio gets smaller as things get bigger</text><rect x="140" y="300" width="80" height="80" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><polygon points="140,300 176.0,264.0 256.0,264.0 220,300" fill="#F1E5F4" stroke="#141B26" stroke-width="3" stroke-linejoin="round"/><polygon points="220,300 256.0,264.0 256.0,344.0 220,380" fill="#DCD2E3" stroke="#141B26" stroke-width="3" stroke-linejoin="round"/><text x="180.0" y="420" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#141B26">1 cm cube</text><rect x="520" y="240" width="160" height="160" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><polygon points="520,240 592.0,168.0 752.0,168.0 680,240" fill="#F1E5F4" stroke="#141B26" stroke-width="3" stroke-linejoin="round"/><polygon points="680,240 752.0,168.0 752.0,328.0 680,400" fill="#DCD2E3" stroke="#141B26" stroke-width="3" stroke-linejoin="round"/><text x="600.0" y="440" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#141B26">2 cm cube</text><rect x="1050" y="160" width="240" height="240" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><polygon points="1050,160 1158.0,52.0 1398.0,52.0 1290,160" fill="#F1E5F4" stroke="#141B26" stroke-width="3" stroke-linejoin="round"/><polygon points="1290,160 1398.0,52.0 1398.0,292.0 1290,400" fill="#DCD2E3" stroke="#141B26" stroke-width="3" stroke-linejoin="round"/><text x="1170.0" y="440" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#141B26">3 cm cube</text><text x="60" y="540" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="start" font-weight="normal" fill="#141B26">surface area</text><text x="330" y="540" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">6 cm²</text><text x="600" y="540" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">24 cm²</text><text x="1170" y="540" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">54 cm²</text><text x="60" y="590" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="start" font-weight="normal" fill="#141B26">volume</text><text x="330" y="590" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">1 cm³</text><text x="600" y="590" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">8 cm³</text><text x="1170" y="590" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">27 cm³</text><text x="60" y="640" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#7B3A8E">SA : V ratio</text><text x="330" y="640" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">6 : 1</text><text x="600" y="640" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">3 : 1</text><text x="1170" y="640" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">2 : 1</text><text x="800" y="720" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#5B6574" font-style="italic">Small organisms and thin leaves have a large SA:V ratio, so diffusion can supply every cell.</text></svg>