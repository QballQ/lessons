<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><text x="800" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#0F2A5F">A fermenter for growing transgenic bacteria</text><rect x="550" y="130" width="500" height="640" rx="60" fill="#EEF1F5" stroke="#141B26" stroke-width="5"/><rect x="520" y="220" width="560" height="470" rx="40" fill="none" stroke="#1E7DB0" stroke-width="6" stroke-dasharray="18,10"/><text x="1090" y="250" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#1E7DB0">water jacket</text><text x="1090" y="280" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#1E7DB0">(keeps the temperature right)</text><rect x="580" y="420" width="440" height="320" rx="20" fill="#E6DDEE" stroke="#141B26" stroke-width="2"/><text x="800" y="600" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26">bacteria + nutrient</text><text x="800" y="630" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26">solution</text><line x1="800" y1="200" x2="800" y2="560" stroke="#141B26" stroke-width="8" stroke-linecap="round"/><rect x="700" y="540" width="200" height="20" rx="4" fill="#5B6574" stroke="#141B26" stroke-width="2"/><rect x="700" y="450" width="200" height="20" rx="4" fill="#5B6574" stroke="#141B26" stroke-width="2"/><text x="800" y="180" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">motor</text><text x="1090" y="520" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#141B26">stirring paddles</text><text x="1090" y="550" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">(mix nutrients, oxygen and heat)</text><line x1="400" y1="300" x2="555" y2="300" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><polygon points="555,300 539.2035138859733,308.62965969487567 539.2035138859733,291.37034030512433" fill="#141B26"/><text x="380" y="290" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="end" font-weight="normal" fill="#141B26">nutrients</text><text x="380" y="318" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="end" font-weight="normal" fill="#141B26">acid or alkali (pH)</text><line x1="400" y1="380" x2="555" y2="380" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><polygon points="555,380 539.2035138859733,388.62965969487567 539.2035138859733,371.37034030512433" fill="#141B26"/><text x="380" y="372" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="end" font-weight="normal" fill="#141B26">steam to sterilise</text><text x="380" y="400" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="end" font-weight="normal" fill="#141B26">before use</text><line x1="400" y1="700" x2="580" y2="700" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><polygon points="580,700 564.2035138859733,708.6296596948756 564.2035138859733,691.3703403051244" fill="#141B26"/><text x="380" y="692" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="end" font-weight="normal" fill="#141B26">filtered air</text><text x="380" y="720" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="end" font-weight="normal" fill="#141B26">(oxygen for respiration)</text><circle cx="640" cy="660" r="7" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><circle cx="700" cy="690" r="7" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><circle cx="760" cy="650" r="7" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><circle cx="820" cy="700" r="7" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><circle cx="880" cy="660" r="7" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><circle cx="940" cy="690" r="7" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><line x1="1045" y1="760" x2="1200" y2="760" stroke="#7B3A8E" stroke-width="5" stroke-linecap="round"/><polygon points="1200,760 1184.2035138859733,768.6296596948756 1184.2035138859733,751.3703403051244" fill="#7B3A8E"/><text x="1210" y="768" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#7B3A8E">harvest: hormone extracted</text><circle cx="800" cy="400" r="18" fill="#F2CE3E" stroke="#141B26" stroke-width="2"/><text x="1090" y="400" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#141B26">probes measure temperature and pH</text><text x="800" y="840" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#7B3A8E" font-style="italic">Aseptic: everything is sterilised so no other microorganisms grow.</text></svg>