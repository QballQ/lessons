<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><rect x="0" y="0" width="1600" height="820" fill="#FFFFFF"/><text x="800" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#0F2A5F">How white blood cells fight pathogens</text><text x="330" y="120" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="bold" fill="#7B3A8E">Phagocyte</text><path d="M 180 330 C 160 220, 330 180, 400 240 C 500 220, 520 360, 440 400 C 420 470, 240 470, 200 410 C 150 400, 150 350, 180 330 Z" fill="#F1E5F4" stroke="#141B26" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="300" cy="320" r="40" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><text x="300" y="328" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#141B26">nucleus</text><rect x="448" y="240" width="44" height="20" rx="10" fill="#FFFFFF" stroke="#141B26" stroke-width="3"/><rect x="478" y="290" width="44" height="20" rx="10" fill="#FFFFFF" stroke="#141B26" stroke-width="3"/><rect x="458" y="340" width="44" height="20" rx="10" fill="#FFFFFF" stroke="#141B26" stroke-width="3"/><line x1="430" y1="300" x2="395" y2="300" stroke="#141B26" stroke-width="3" stroke-linecap="round"/><polygon points="395,300 410.7964861140267,291.37034030512433 410.7964861140267,308.62965969487567" fill="#141B26"/><text x="330" y="520" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26">surrounds and ingests (eats) the</text><text x="330" y="552" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26">microorganism, then digests it</text><text x="1050" y="120" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="bold" fill="#7B3A8E">Lymphocyte</text><circle cx="820" cy="320" r="90" fill="#F1E5F4" stroke="#141B26" stroke-width="4"/><circle cx="820" cy="320" r="55" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><text x="820" y="328" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#141B26">nucleus</text><path d="M 960 250 L 1000 250 M 1000 250 L 1025 228 M 1000 250 L 1025 272" fill="none" stroke="#7B3A8E" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M 990 320 L 1030 320 M 1030 320 L 1055 298 M 1030 320 L 1055 342" fill="none" stroke="#7B3A8E" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M 960 390 L 1000 390 M 1000 390 L 1025 368 M 1000 390 L 1025 412" fill="none" stroke="#7B3A8E" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="1010" y="450" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#7B3A8E">antibodies</text><rect x="1200" y="290" width="160" height="70" rx="30" fill="#FFFFFF" stroke="#141B26" stroke-width="3"/><g transform="rotate(180 1170 325)"><path d="M 1170 325 L 1200 325 M 1200 325 L 1218 309 M 1200 325 L 1218 341" fill="none" stroke="#7B3A8E" stroke-width="5"/></g><g transform="rotate(0 1390 325)"><path d="M 1390 325 L 1420 325 M 1420 325 L 1438 309 M 1420 325 L 1438 341" fill="none" stroke="#7B3A8E" stroke-width="5"/></g><g transform="rotate(-90 1280 260)"><path d="M 1280 260 L 1310 260 M 1310 260 L 1328 244 M 1310 260 L 1328 276" fill="none" stroke="#7B3A8E" stroke-width="5"/></g><g transform="rotate(90 1280 390)"><path d="M 1280 390 L 1310 390 M 1310 390 L 1328 374 M 1310 390 L 1328 406" fill="none" stroke="#7B3A8E" stroke-width="5"/></g><text x="1280" y="330" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">pathogen</text><text x="1050" y="520" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26">makes antibodies that fit the surface of one type of pathogen.</text><text x="1050" y="552" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26">Antibodies make pathogens stick together, burst, or easier to ingest.</text><rect x="120" y="620" width="1360" height="150" rx="14" fill="#EEF1F5" stroke="#7B3A8E" stroke-width="3"/><text x="800" y="670" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#7B3A8E">Memory cells: after an infection (or a vaccine) some lymphocytes stay ready.</text><text x="800" y="710" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26">Next time, the right antibodies are made very fast and in large numbers: you are immune.</text><text x="800" y="745" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#5B6574" font-style="italic">Making the first antibodies takes days, which is why you are ill before you get better.</text></svg>