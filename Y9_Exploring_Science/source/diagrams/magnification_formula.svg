<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600"><rect x="0" y="0" width="1600" height="600" fill="#FFFFFF"/><text x="800" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Magnification</text><rect x="80" y="100" width="760" height="110" rx="12" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="460.0" y="148.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">total magnification =</text><text x="460.0" y="178.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">eyepiece magnification x objective magnification</text><text x="80" y="260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="start" font-weight="normal" fill="#141B26">e.g. eyepiece x10 and objective x40:  10 x 40 = x400</text><text x="80" y="340" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="start" font-weight="normal" fill="#141B26">magnification = image size / actual size</text><text x="80" y="382" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="start" font-weight="normal" fill="#141B26">actual size = image size / magnification</text><text x="80" y="424" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="start" font-weight="normal" fill="#141B26">e.g. a cell drawn 40 mm wide at x400:</text><text x="80" y="466" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="start" font-weight="normal" fill="#141B26">actual size = 40 / 400 = 0.1 mm (100 micrometres)</text><polygon points="1230,110 980,430 1480,430" fill="#FFFFFF" stroke="#141B26" stroke-width="4" stroke-linejoin="round"/><line x1="1080" y1="300" x2="1380" y2="300" stroke="#141B26" stroke-width="3" stroke-linecap="round"/><line x1="1230" y1="300" x2="1230" y2="430" stroke="#141B26" stroke-width="3" stroke-linecap="round"/><text x="1230" y="245" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="bold" fill="#141B26">image size</text><text x="1145" y="380" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="bold" fill="#141B26">actual</text><text x="1145" y="406" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="bold" fill="#141B26">size</text><text x="1315" y="380" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="bold" fill="#141B26">magnifi-</text><text x="1315" y="406" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="bold" fill="#141B26">cation</text><text x="1230" y="485" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#0F2A5F" font-style="italic">Cover the one you want. Use the same units for both sizes.</text></svg>