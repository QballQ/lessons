<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="760" viewBox="0 0 1660 760"><rect x="0" y="0" width="1660" height="760" fill="#FFFFFF"/><text x="800" y="60" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Sexual reproduction: two gametes fuse to make a zygote</text><ellipse cx="230" cy="330" rx="70" ry="50" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><path d="M 300 330 C 380 300, 400 380, 480 330" fill="none" stroke="#141B26" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="230" y="338" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="bold" fill="#141B26">23</text><text x="230" y="440" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">sperm cell (male gamete)</text><text x="230" y="475" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#5B6574">23 chromosomes</text><text x="560" y="345" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="75" text-anchor="middle" font-weight="bold" fill="#7B3A8E">+</text><circle cx="720" cy="330" r="90" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><text x="720" y="340" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="bold" fill="#141B26">23</text><text x="720" y="470" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">egg cell (female gamete)</text><text x="720" y="505" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#5B6574">23 chromosomes</text><line x1="840" y1="330" x2="960" y2="330" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="960,330 944.2035138859733,338.62965969487567 944.2035138859733,321.37034030512433" fill="#7B3A8E"/><text x="900" y="300" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#7B3A8E">fertilisation</text><circle cx="1100" cy="330" r="100" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="1100" y="340" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#141B26">46</text><text x="1100" y="470" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">zygote (fertilised egg)</text><text x="1100" y="505" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#5B6574">23 pairs = 46 chromosomes</text><line x1="1220" y1="330" x2="1310" y2="330" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="1310,330 1294.2035138859733,338.62965969487567 1294.2035138859733,321.37034030512433" fill="#7B3A8E"/><text x="1265" y="300" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#7B3A8E">cell division</text><circle cx="1400" cy="290" r="32" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><circle cx="1460" cy="290" r="32" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><circle cx="1400" cy="360" r="32" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><circle cx="1460" cy="360" r="32" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><circle cx="1430" cy="325" r="32" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="1460" y="470" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">ball of cells</text><text x="1460" y="505" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#5B6574">each with 46 chromosomes</text><text x="800" y="640" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#7B3A8E" font-style="italic">Every gamete carries slightly different genetic information, so brothers and sisters are not identical.</text></svg>