<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760"><rect x="0" y="0" width="1800" height="760" fill="#FFFFFF"/><text x="900" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Density: floating and sinking</text><polygon points="360,140 110,460 610,460" fill="#FFFFFF" stroke="#141B26" stroke-width="4" stroke-linejoin="round"/><line x1="210" y1="330" x2="510" y2="330" stroke="#141B26" stroke-width="3" stroke-linecap="round"/><line x1="360" y1="330" x2="360" y2="460" stroke="#141B26" stroke-width="3" stroke-linecap="round"/><text x="360" y="280" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">mass</text><text x="275" y="416" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="bold" fill="#141B26">density</text><text x="445" y="416" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="bold" fill="#141B26">volume</text><text x="360" y="530" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="middle" font-weight="normal" fill="#141B26">density = mass ÷ volume</text><text x="360" y="566" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="middle" font-weight="normal" fill="#141B26">units: g/cm³ or kg/m³</text><text x="360" y="602" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="middle" font-weight="normal" fill="#141B26">1 g/cm³ = 1000 kg/m³</text><rect x="880" y="240" width="760" height="380" rx="0" fill="#DCE8F5" stroke="#DCE8F5" stroke-width="0"/><path d="M 880 150 L 880 620 L 1640 620 L 1640 150" fill="none" stroke="#141B26" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><line x1="880" y1="240" x2="1640" y2="240" stroke="#141B26" stroke-width="2" stroke-linecap="round"/><text x="1620" y="280" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="end" font-weight="normal" fill="#5B6574">water: 1.0 g/cm³</text><rect x="950" y="200" width="150" height="70" rx="6" fill="#E9D8B8" stroke="#141B26" stroke-width="3"/><text x="1025" y="166.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">cork: 0.25 g/cm³</text><rect x="1200" y="228" width="150" height="80" rx="6" fill="#FFFFFF" stroke="#141B26" stroke-width="3"/><text x="1275" y="188" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">ice: 0.92 g/cm³</text><rect x="1420" y="534" width="150" height="80" rx="6" fill="#5B6574" stroke="#141B26" stroke-width="3"/><text x="1495" y="514" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">iron: 7.9 g/cm³</text><text x="1025" y="340" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26" font-style="italic">floats high</text><text x="1275" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26" font-style="italic">floats low</text><text x="1495" y="480" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26" font-style="italic">sinks</text><text x="1260.0" y="700" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#0F2A5F" font-style="italic">Less dense than the liquid: it floats.   Denser than the liquid: it sinks.</text></svg>