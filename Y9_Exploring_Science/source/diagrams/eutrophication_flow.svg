<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><rect x="0" y="0" width="1600" height="820" fill="#FFFFFF"/><text x="800" y="55" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="34" text-anchor="middle" font-weight="bold" fill="#0F2A5F">How fertiliser can kill fish (eutrophication)</text><rect x="80" y="130" width="440" height="230" rx="14" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><circle cx="130" cy="180" r="30" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="3"/><text x="130" y="191" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#FFFFFF">1</text><text x="330" y="260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">Fertiliser is spread</text><text x="330" y="295" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">on a field.</text><line x1="525" y1="245" x2="575" y2="245" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="575,245 559.2035138859733,253.62965969487564 559.2035138859733,236.37034030512436" fill="#7B3A8E"/><rect x="580" y="130" width="440" height="230" rx="14" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><circle cx="630" cy="180" r="30" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="3"/><text x="630" y="191" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#FFFFFF">2</text><text x="830" y="260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">Rain washes the nutrients</text><text x="830" y="295" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">into a river or lake.</text><line x1="1025" y1="245" x2="1075" y2="245" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="1075,245 1059.2035138859733,253.62965969487564 1059.2035138859733,236.37034030512436" fill="#7B3A8E"/><rect x="1080" y="130" width="440" height="230" rx="14" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><circle cx="1130" cy="180" r="30" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="3"/><text x="1130" y="191" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#FFFFFF">3</text><text x="1330" y="260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">Algae and water plants</text><text x="1330" y="295" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">grow very fast.</text><rect x="80" y="460" width="440" height="230" rx="14" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><circle cx="130" cy="510" r="30" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="3"/><text x="130" y="521" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#FFFFFF">4</text><text x="330" y="590" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">They block the light.</text><text x="330" y="625" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">Deeper plants die.</text><line x1="525" y1="575" x2="575" y2="575" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="575,575 559.2035138859733,583.6296596948756 559.2035138859733,566.3703403051244" fill="#7B3A8E"/><rect x="580" y="460" width="440" height="230" rx="14" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><circle cx="630" cy="510" r="30" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="3"/><text x="630" y="521" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#FFFFFF">5</text><text x="830" y="590" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">Decomposers break down</text><text x="830" y="625" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">the dead plants, using oxygen.</text><line x1="1025" y1="575" x2="1075" y2="575" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="1075,575 1059.2035138859733,583.6296596948756 1059.2035138859733,566.3703403051244" fill="#7B3A8E"/><rect x="1080" y="460" width="440" height="230" rx="14" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><circle cx="1130" cy="510" r="30" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="3"/><text x="1130" y="521" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#FFFFFF">6</text><text x="1330" y="590" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">Too little oxygen</text><text x="1330" y="625" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">in the water: fish die.</text><line x1="1300" y1="365" x2="1300" y2="420" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="1300,420 1291.3703403051243,404.2035138859733 1308.6296596948757,404.2035138859733" fill="#7B3A8E"/><path d="M 1300 420 L 1300 445 L 300 445 L 300 455" fill="none" stroke="#7B3A8E" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><line x1="300" y1="445" x2="300" y2="458" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="300,458 291.37034030512433,442.2035138859733 308.62965969487567,442.2035138859733" fill="#7B3A8E"/></svg>