<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620"><rect x="0" y="0" width="1600" height="620" fill="#FFFFFF"/><text x="800" y="60" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="34" text-anchor="middle" font-weight="bold" fill="#0F2A5F">The probability scale</text><line x1="160" y1="300" x2="1440" y2="300" stroke="#141B26" stroke-width="6" stroke-linecap="round"/><line x1="160.0" y1="278" x2="160.0" y2="322" stroke="#141B26" stroke-width="6" stroke-linecap="round"/><text x="160.0" y="255" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#0F2A5F">0%</text><text x="160.0" y="370" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#141B26">fraction 0</text><text x="160.0" y="405" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#141B26">decimal 0</text><text x="160.0" y="460" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="bold" fill="#7B3A8E">impossible</text><line x1="480.0" y1="278" x2="480.0" y2="322" stroke="#141B26" stroke-width="6" stroke-linecap="round"/><text x="480.0" y="255" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#0F2A5F">25%</text><text x="480.0" y="370" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#141B26">fraction 1/4</text><text x="480.0" y="405" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#141B26">decimal 0.25</text><text x="480.0" y="460" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="bold" fill="#7B3A8E">unlikely</text><line x1="800.0" y1="278" x2="800.0" y2="322" stroke="#141B26" stroke-width="6" stroke-linecap="round"/><text x="800.0" y="255" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#0F2A5F">50%</text><text x="800.0" y="370" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#141B26">fraction 1/2</text><text x="800.0" y="405" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#141B26">decimal 0.5</text><text x="800.0" y="460" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="bold" fill="#7B3A8E">even chance</text><line x1="1120.0" y1="278" x2="1120.0" y2="322" stroke="#141B26" stroke-width="6" stroke-linecap="round"/><text x="1120.0" y="255" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#0F2A5F">75%</text><text x="1120.0" y="370" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#141B26">fraction 3/4</text><text x="1120.0" y="405" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#141B26">decimal 0.75</text><text x="1120.0" y="460" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="bold" fill="#7B3A8E">likely</text><line x1="1440.0" y1="278" x2="1440.0" y2="322" stroke="#141B26" stroke-width="6" stroke-linecap="round"/><text x="1440.0" y="255" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#0F2A5F">100%</text><text x="1440.0" y="370" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#141B26">fraction 1</text><text x="1440.0" y="405" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#141B26">decimal 1</text><text x="1440.0" y="460" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="bold" fill="#7B3A8E">certain</text><text x="160" y="540" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#5B6574">e.g. finding a live dinosaur</text><text x="800" y="540" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#5B6574">e.g. a coin landing heads</text><text x="1440" y="540" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#5B6574">e.g. the Sun rising tomorrow</text></svg>