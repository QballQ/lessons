troke-width="2"/><text x="822" y="190" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" text-anchor="start" font-weight="normal" fill="#5B6574">atomic number</text><text x="1028" y="190" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" text-anchor="end" font-weight="normal" fill="#5B6574">relative</text><text x="1028" y="210" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" text-anchor="end" font-weight="normal" fill="#5B6574">atomic mass</text><text x="925.0" y="260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#141B26">symbol</text><text x="925.0" y="292" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#141B26">name</text><text x="1060" y="230" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#5B6574" font-style="italic">how to read a square</text><text x="250" y="810" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#0F2A5F">Group 1: alkali metals (very reactive metals).   Group 7: halogens (reactive non-metals).   Group 0: noble gases (unreactive).</text><text x="250" y="846" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#0F2A5F">Elements in the same group have the same number of outer electrons, so they react in similar ways.</text><text x="250" y="882" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#0F2A5F">Across a period the atomic number goes up by one each time; a new period starts when a new shell starts to fill.</text></svg>