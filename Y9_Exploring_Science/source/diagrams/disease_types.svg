<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><rect x="0" y="0" width="1600" height="820" fill="#FFFFFF"/><text x="800" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Types of disease</text><text x="300" y="125" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#7B3A8E">type</text><text x="770" y="125" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#7B3A8E">cause</text><text x="1290" y="125" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#7B3A8E">examples</text><rect x="80" y="150" width="1440" height="105" rx="12" fill="#F1E5F4" stroke="#141B26" stroke-width="2"/><text x="300" y="212" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="middle" font-weight="bold" fill="#141B26">infectious (communicable)</text><text x="770" y="212" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">a pathogen gets into the body</text><text x="1290" y="212" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#141B26">flu, cholera, malaria, chickenpox</text><rect x="80" y="270" width="1440" height="105" rx="12" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><text x="300" y="332" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="middle" font-weight="bold" fill="#141B26">deficiency</text><text x="770" y="332" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">a nutrient is missing from the diet</text><text x="1290" y="332" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#141B26">scurvy (vitamin C), anaemia (iron), rickets</text><rect x="80" y="390" width="1440" height="105" rx="12" fill="#F1E5F4" stroke="#141B26" stroke-width="2"/><text x="300" y="452" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="middle" font-weight="bold" fill="#141B26">genetic (inherited)</text><text x="770" y="452" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">a fault in the DNA</text><text x="1290" y="452" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#141B26">sickle cell disease, haemophilia</text><rect x="80" y="510" width="1440" height="105" rx="12" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><text x="300" y="572" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="middle" font-weight="bold" fill="#141B26">lifestyle</text><text x="770" y="572" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">how we live raises the risk</text><text x="1290" y="572" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#141B26">lung cancer (smoking), heart disease</text><rect x="80" y="630" width="1440" height="105" rx="12" fill="#F1E5F4" stroke="#141B26" stroke-width="2"/><text x="300" y="692" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="middle" font-weight="bold" fill="#141B26">autoimmune</text><text x="770" y="692" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">white blood cells attack the body</text><text x="1290" y="692" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#141B26">type 1 diabetes</text><text x="800" y="790" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#0F2A5F" font-style="italic">Only infectious diseases can be passed from person to person. The others are non-communicable.</text></svg>