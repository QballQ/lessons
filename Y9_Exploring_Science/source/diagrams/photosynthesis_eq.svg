<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560"><rect x="0" y="0" width="1600" height="560" fill="#FFFFFF"/><text x="800" y="70" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="45" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Photosynthesis</text><text x="800" y="120" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#5B6574">happens in chloroplasts, in the light</text><rect x="120" y="180" width="330" height="110" rx="12" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="285.0" y="245.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="normal" fill="#141B26">carbon dioxide</text><text x="500" y="250" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="55" text-anchor="middle" font-weight="bold" fill="#141B26">+</text><rect x="550" y="180" width="250" height="110" rx="12" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="675.0" y="245.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="normal" fill="#141B26">water</text><line x1="830" y1="235" x2="980" y2="235" stroke="#7B3A8E" stroke-width="7" stroke-linecap="round"/><polygon points="980,235 964.2035138859733,243.62965969487564 964.2035138859733,226.37034030512436" fill="#7B3A8E"/><text x="905" y="205" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#7B3A8E">light energy</text><text x="905" y="285" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#7B3A8E">chlorophyll</text><rect x="1000" y="180" width="250" height="110" rx="12" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><text x="1125.0" y="245.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="normal" fill="#141B26">glucose</text><text x="1290" y="250" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="55" text-anchor="middle" font-weight="bold" fill="#141B26">+</text><rect x="1330" y="180" width="220" height="110" rx="12" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><text x="1440.0" y="245.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="normal" fill="#141B26">oxygen</text><text x="285" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#141B26">6CO2</text><text x="500" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="normal" fill="#141B26">+</text><text x="675" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#141B26">6H2O</text><line x1="830" y1="340" x2="980" y2="340" stroke="#141B26" stroke-width="5" stroke-linecap="round"/><polygon points="980,340 964.2035138859733,348.62965969487567 964.2035138859733,331.37034030512433" fill="#141B26"/><text x="1125" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#141B26">C6H12O6</text><text x="1290" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="normal" fill="#141B26">+</text><text x="1440" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#141B26">6O2</text><line x1="120" y1="410" x2="800" y2="410" stroke="#5B6574" stroke-width="2" stroke-linecap="round"/><line x1="1000" y1="410" x2="1550" y2="410" stroke="#5B6574" stroke-width="2" stroke-linecap="round"/><text x="1275" y="450" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#5B6574">products</text><text x="460" y="450" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#5B6574">reactants (raw materials)</text><text x="800" y="450" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#141B26"></text><text x="800" y="520" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#7B3A8E" font-style="italic">The energy from light is stored in the glucose.</text></svg>