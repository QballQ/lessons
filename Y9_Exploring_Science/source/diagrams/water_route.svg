<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560"><rect x="0" y="0" width="1600" height="560" fill="#FFFFFF"/><text x="800" y="55" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#0F2A5F">The route water takes through a plant</text><rect x="60" y="150" width="210" height="130" rx="12" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="165.0" y="207.85" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#141B26">soil</text><text x="165.0" y="240.35" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#141B26">water</text><line x1="275" y1="215" x2="310" y2="215" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="310,215 294.2035138859733,223.62965969487564 294.2035138859733,206.37034030512436" fill="#7B3A8E"/><rect x="315" y="150" width="210" height="130" rx="12" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><text x="420.0" y="207.85" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#141B26">root hair</text><text x="420.0" y="240.35" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#141B26">cell</text><line x1="530" y1="215" x2="565" y2="215" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="565,215 549.2035138859733,223.62965969487564 549.2035138859733,206.37034030512436" fill="#7B3A8E"/><rect x="570" y="150" width="210" height="130" rx="12" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="675.0" y="207.85" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#141B26">xylem</text><text x="675.0" y="240.35" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#141B26">in root</text><line x1="785" y1="215" x2="820" y2="215" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="820,215 804.2035138859733,223.62965969487564 804.2035138859733,206.37034030512436" fill="#7B3A8E"/><rect x="825" y="150" width="210" height="130" rx="12" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="930.0" y="207.85" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#141B26">xylem</text><text x="930.0" y="240.35" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#141B26">in stem</text><line x1="1040" y1="215" x2="1075" y2="215" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="1075,215 1059.2035138859733,223.62965969487564 1059.2035138859733,206.37034030512436" fill="#7B3A8E"/><rect x="1080" y="150" width="210" height="130" rx="12" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="1185.0" y="207.85" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#141B26">cells in</text><text x="1185.0" y="240.35" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#141B26">the leaf</text><line x1="1295" y1="215" x2="1330" y2="215" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="1330,215 1314.2035138859733,223.62965969487564 1314.2035138859733,206.37034030512436" fill="#7B3A8E"/><rect x="1335" y="150" width="210" height="130" rx="12" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><text x="1440.0" y="207.85" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#141B26">out through</text><text x="1440.0" y="240.35" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#141B26">stomata</text><text x="420" y="330" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#5B6574">large surface area:</text><text x="420" y="358" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#5B6574">absorbs water fast</text><text x="930" y="330" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#5B6574">xylem: hollow tubes made of dead cells;</text><text x="930" y="358" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#5B6574">they carry water and mineral salts up</text><text x="800" y="450" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#7B3A8E" font-style="italic">Water is needed for photosynthesis, to keep cells firm (or the plant wilts) and to keep leaves cool.</text></svg>