<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><rect x="0" y="0" width="1600" height="700" fill="#FFFFFF"/><text x="800" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Antibody levels after a first and a second infection by the same pathogen</text><line x1="160" y1="560" x2="1480" y2="560" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><line x1="160" y1="560" x2="160" y2="110" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><text x="820" y="620" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#141B26">time (weeks)</text><text x="100" y="340" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26" transform="rotate(-90 100 340)">amount of antibody in blood</text><path d="M 220,559 L 228,558 L 236,558 L 244,557 L 252,556 L 260,555 L 268,554 L 276,552 L 284,550 L 292,548 L 300,545 L 308,542 L 316,538 L 324,534 L 332,529 L 340,524 L 348,518 L 356,512 L 364,505 L 372,498 L 380,490 L 388,482 L 396,474 L 404,466 L 412,458 L 420,451 L 428,444 L 436,438 L 444,432 L 452,427 L 460,424 L 468,421 L 476,420 L 484,420 L 492,421 L 500,424 L 508,427 L 516,432 L 524,438 L 532,444 L 540,451 L 548,458 L 556,466 L 564,474 L 572,482 L 580,490 L 588,498 L 596,505 L 604,512 L 612,518 L 620,524 L 628,529 L 636,534 L 644,538 L 652,542 L 660,545 L 668,548 L 676,550 L 684,552 L 692,554 L 700,555 L 708,556 L 716,557 L 724,558 L 732,558" fill="none" stroke="#7B3A8E" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M 860,498 L 868,484 L 876,469 L 884,452 L 892,433 L 900,413 L 908,391 L 916,367 L 924,343 L 932,318 L 940,293 L 948,269 L 956,246 L 964,224 L 972,205 L 980,189 L 988,176 L 996,166 L 1004,161 L 1012,160 L 1020,163 L 1028,171 L 1036,182 L 1044,196 L 1052,214 L 1060