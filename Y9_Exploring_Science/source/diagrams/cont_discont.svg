<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><rect x="0" y="0" width="1600" height="820" fill="#FFFFFF"/><text x="420" y="60" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="34" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Continuous variation</text><text x="420" y="100" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#5B6574">any value between two points, e.g. height, mass, foot length</text><rect x="120" y="610" width="56" height="40" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><rect x="176" y="560" width="56" height="90" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><rect x="232" y="480" width="56" height="170" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><rect x="288" y="390" width="56" height="260" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><rect x="344" y="320" width="56" height="330" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><rect x="400" y="300" width="56" height="350" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><rect x="456" y="350" width="56" height="300" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><rect x="512" y="440" width="56" height="210" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><rect x="568" y="530" width="56" height="120" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><rect x="624" y="590" width="56" height="60" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><rect x="680" y="620" width="56" height="30" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><path d="M 148.0,610 L 204.0,560 L 260.0,480 L 316.0,390 L 372.0,320 L 428.0,300 L 484.0,350 L 540.0,440 L 596.0,530 L 652.0,590 L 708.0,620" fill="none" stroke="#7B3A8E" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><line x1="120" y1="650" x2="756" y2="650" stroke="#141B26" stroke-width="3" stroke-linecap="round"/><line x1="120" y1="650" x2="120" y2="180" stroke="#141B26" stroke-width="3" stroke-linecap="round"/><text x="428.0" y="700" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#141B26">height (cm), in groups</text><text x="80" y="420" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#141B26" transform="rotate(-90 80 420)">number of students</text><text x="428.0" y="760" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#7B3A8E" font-style="italic">bars touch; the curve is a normal distribution (bell shape)</text><text x="1240" y="60" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="34" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Discontinuous variation</text><text x="1240" y="100" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#5B6574">a limited set of values, e.g. blood group, eye colour</text><rect x="980" y="350" width="90" height="300" rx="0" fill="#F1E5F4" stroke="#141B26" stroke-width="2"/><text x="1025" y="690" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">A</text><rect x="1130" y="570" width="90" height="80" rx="0" fill="#F1E5F4" stroke="#141B26" stroke-width="2"/><text x="1175" y="690" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">B</text><rect x="1280" y="620" width="90" height="30" rx="0" fill="#F1E5F4" stroke="#141B26" stroke-width="2"/><text x="1325" y="690" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">AB</text><rect x="1430" y="300" width="90" height="350" rx="0" fill="#F1E5F4" stroke="#141B26" stroke-width="2"/><text x="1475" y="690" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">O</text><line x1="920" y1="650" x2="1560" y2="650" stroke="#141B26" stroke-width="3" stroke-linecap="round"/><line x1="920" y1="650" x2="920" y2="180" stroke="#141B26" stroke-width="3" stroke-linecap="round"/><text x="1240" y="730" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#141B26">blood group</text><text x="880" y="420" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#141B26" transform="rotate(-90 880 420)">number of people</text><text x="1240" y="775" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#7B3A8E" font-style="italic">gaps between the bars</text></svg>