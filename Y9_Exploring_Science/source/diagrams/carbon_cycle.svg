omposers</text><rect x="620" y="700" width="360" height="110" rx="12" fill="#E9DFCB" stroke="#141B26" stroke-width="3"/><text x="800.0" y="747.85" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#141B26">fossil fuels</text><text x="800.0" y="780.35" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#141B26">(coal, oil, gas)</text><line x1="640" y1="180" x2="300" y2="400" stroke="#2E7D32" stroke-width="6" stroke-linecap="round"/><polygon points="300,400 308.5741846699017,384.173333981965 317.9503319885087,398.6637434743577" fill="#2E7D32"/><text x="400" y="270" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#2E7D32">photosynthesis</text><text x="400" y="300" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#2E7D32">(CO2 taken in)</text><line x1="330" y1="400" x2="700" y2="200" stroke="#141B26" stroke-width="5" stroke-linecap="round"/><polygon points="700,200 690.2072784595664,215.10306607386485 682.0001780881853,199.91993038680988" fill="#141B26"/><text x="560" y="330" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26">respiration</text><line x1="800" y1="400" x2="800" y2="205" stroke="#141B26" stroke-width="5" stroke-linecap="round"/><polygon points="800,205 808.6296596948756,220.79648611402672 791.3703403051244,220.79648611402672" fill="#141B26"/><text x="880" y="310" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26">respiration</text><line x1="1300" y1="400" x2="1000" y2="200" stroke="#141B26" stroke-width="5" stroke-linecap="round"/><polygon points="1000,200 1017.930344846784,201.58200305796302 1008.356596994575,