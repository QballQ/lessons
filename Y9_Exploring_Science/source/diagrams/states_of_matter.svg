eight="normal" fill="#141B26">they move quickly</text><text x="1540.0" y="596" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">in all directions</text><text x="950" y="690" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="35" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Changes of state</text><rect x="220" y="722" width="220" height="76" rx="38" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="330.0" y="769.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#141B26">SOLID</text><rect x="840" y="722" width="220" height="76" rx="38" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="950.0" y="769.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#141B26">LIQUID</text><rect x="1460" y="722" width="220" height="76" rx="38" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="1570.0" y="769.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#141B26">GAS</text><line x1="450" y1="744" x2="830" y2="744" stroke="#7B3A8E" stroke-width="4" stroke-linecap="round"/><polygon points="830,744 814.2035138859733,752.6296596948756 814.2035138859733,735.3703403051244" fill="#7B3A8E"/><text x="640.0" y="726" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#7B3A8E">melting</text><line x1="830" y1="776" x2="450" y2="776" stroke="#0F2A5F" stroke-width="4" stroke-linecap="round"/><polygon points="450,776 465.7964861140267,767.3703403051244 465.7964861140267,784.6296596948756" fill="#0F2A5F"/><text x="640.0" y="812" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#0F2A5F">freezing</text><line x1="1070" y1="744" x2="1450" y2="744" stroke="#7B3A8E" stroke-width="4" stroke-linecap="round"/><polygon points="1450,744 1434.2035138859733,752.6296596948756 1434.2035138859733,735.3703403051244" fill="#7B3A8E"/><text x="1260.0" y="726" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#7B3A8E">evaporating or boiling</text><line x1="1450" y1="776" x2="1070" y2="776" stroke="#0F2A5F" stroke-width="4" stroke-linecap="round"/><polygon points="1070,776 1085.7964861140267,767.3703403051244 1085.7964861140267,784.6296596948756" fill="#0F2A5F"/><text x="1260.0" y="812" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#0F2A5F">condensing</text><line x1="330" y1="890" x2="1570" y2="890" stroke="#7B3A8E" stroke-width="4" stroke-linecap="round"/><polygon points="1570,890 1554.2035138859733,898.6296596948756 1554.2035138859733,881.3703403051244" fill="#7B3A8E"/><text x="950" y="872" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#7B3A8E">heating: the particles gain energy and move faster</text><line x1="1570" y1="960" x2="330" y2="960" stroke="#0F2A5F" stroke-width="4" stroke-linecap="round"/><polygon points="330,960 345.7964861140267,951.3703403051244 345.7964861140267,968.6296596948756" fill="#0F2A5F"/><text x="950" y="942" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#0F2A5F">cooling: the particles lose energy and move more slowly</text><text x="950" y="1016" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#0F2A5F" font-style="italic">The particles themselves do not change, and none are lost, so the mass stays the same.</text></svg>