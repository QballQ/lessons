<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520"><rect x="0" y="0" width="1600" height="520" fill="#FFFFFF"/><text x="800" y="70" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="36" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Aerobic respiration</text><text x="800" y="120" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#5B6574">happens in every living cell, all the time (day and night)</text><rect x="120" y="180" width="250" height="110" rx="12" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><text x="245.0" y="245.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26">glucose</text><text x="410" y="250" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="44" text-anchor="middle" font-weight="bold" fill="#141B26">+</text><rect x="450" y="180" width="220" height="110" rx="12" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><text x="560.0" y="245.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26">oxygen</text><line x1="700" y1="235" x2="850" y2="235" stroke="#7B3A8E" stroke-width="7" stroke-linecap="round"/><polygon points="850,235 834.2035138859733,243.62965969487564 834.2035138859733,226.37034030512436" fill="#7B3A8E"/><rect x="870" y="180" width="330" height="110" rx="12" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="1035.0" y="245.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26">carbon dioxide</text><text x="1240" y="250" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="44" text-anchor="middle" font-weight="bold" fill="#141B26">+</text><rect x="1280" y="180" width="250" height="110" rx="12" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="1405.0" y="245.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26">water</text><text x="1200" y="400" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#7B3A8E">(+ energy released)</text><text x="245" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="34" text-anchor="middle" font-weight="bold" fill="#141B26">C6H12O6</text><text x="410" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="34" text-anchor="middle" font-weight="normal" fill="#141B26">+</text><text x="560" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="34" text-anchor="middle" font-weight="bold" fill="#141B26">6O2</text><line x1="700" y1="340" x2="850" y2="340" stroke="#141B26" stroke-width="5" stroke-linecap="round"/><polygon points="850,340 834.2035138859733,348.62965969487567 834.2035138859733,331.37034030512433" fill="#141B26"/><text x="1035" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="34" text-anchor="middle" font-weight="bold" fill="#141B26">6CO2</text><text x="1240" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="34" text-anchor="middle" font-weight="normal" fill="#141B26">+</text><text x="1300" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="34" text-anchor="middle" font-weight="bold" fill="#141B26">6H2O</text><text x="800" y="460" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#7B3A8E" font-style="italic">Respiration is the opposite of photosynthesis: it releases the energy stored in glucose.</text></svg>