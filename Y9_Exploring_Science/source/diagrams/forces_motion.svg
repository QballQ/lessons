<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1040" viewBox="0 0 1900 1040"><rect x="0" y="0" width="1900" height="1040" fill="#FFFFFF"/><text x="950" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Forces and movement</text><text x="480" y="110" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#141B26">Forces on a sailing boat</text><rect x="120" y="400" width="760" height="90" rx="0" fill="#DCE8F5" stroke="#DCE8F5" stroke-width="0"/><line x1="120" y1="400" x2="880" y2="400" stroke="#141B26" stroke-width="2" stroke-linecap="round"/><polygon points="330,360 670,360 620,440 380,440" fill="#EEF1F5" stroke="#141B26" stroke-width="4" stroke-linejoin="round"/><line x1="500" y1="360" x2="500" y2="150" stroke="#141B26" stroke-width="5" stroke-linecap="round"/><polygon points="506,155 506,340 640,340" fill="#FFFFFF" stroke="#141B26" stroke-width="3" stroke-linejoin="round"/><line x1="500" y1="410" x2="500" y2="550" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="500,550 491.37034030512433,534.2035138859733 508.62965969487567,534.2035138859733" fill="#7B3A8E"/><text x="520" y="550" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="bold" fill="#7B3A8E">weight</text><line x1="430" y1="430" x2="430" y2="290" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="430,290 438.62965969487567,305.7964861140267 421.37034030512433,305.7964861140267" fill="#7B3A8E"/><text x="410" y="290" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="end" font-weight="bold" fill="#7B3A8E">upthrust</text><line x1="680" y1="270" x2="850" y2="270" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="850,270 834.2035138859733,278.62965969487567 834.2035138859733,261.37034030512433" fill="#7B3A8E"/><text x="770" y="204" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#7B3A8E">force from the</text><text x="770" y="230" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#7B3A8E">wind on the sail</text><line x1="320" y1="410" x2="170" y2="410" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="170,410 185.79648611402672,401.37034030512433 185.79648611402672,418.62965969487567" fill="#7B3A8E"/><text x="230" y="344" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#7B3A8E">water resistance</text><text x="230" y="370" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#7B3A8E">(drag)</text><text x="480" y="600" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#0F2A5F">Steady speed: forward force = drag (balanced).</text><text x="480" y="630" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#0F2A5F">Stronger wind: forward force is bigger (unbalanced),</text><text x="480" y="660" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#0F2A5F">so the boat accelerates until drag catches up.</text><text x="1380" y="110" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#141B26">A falling skydiver</text><circle cx="1090" cy="354" r="22" fill="#FFFFFF" stroke="#141B26" stroke-width="3"/><rect x="1064" y="378" width="52" height="70" rx="10" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><line x1="1064" y1="392" x2="1028" y2="366" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><line x1="1116" y1="392" x2="1152" y2="366" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><line x1="1076" y1="448" x2="1060" y2="492" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><line x1="1104" y1="448" x2="1120" y2="492" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><line x1="1090" y1="500" x2="1090" y2="650" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="1090,650 1081.3703403051243,634.2035138859733 1098.6296596948757,634.2035138859733" fill="#7B3A8E"/><text x="1090" y="700" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">speed = 0</text><text x="1090" y="727" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">no air resistance</text><text x="1090" y="766" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#0F2A5F">accelerating</text><circle cx="1380" cy="354" r="22" fill="#FFFFFF" stroke="#141B26" stroke-width="3"/><rect x="1354" y="378" width="52" height="70" rx="10" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><line x1="1354" y1="392" x2="1318" y2="366" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><line x1="1406" y1="392" x2="1442" y2="366" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><line x1="1366" y1="448" x2="1350" y2="492" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><line x1="1394" y1="448" x2="1410" y2="492" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><line x1="1380" y1="500" x2="1380" y2="650" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="1380,650 1371.3703403051243,634.2035138859733 1388.6296596948757,634.2035138859733" fill="#7B3A8E"/><line x1="1380" y1="324" x2="1380" y2="244" stroke="#1E7DB0" stroke-width="6" stroke-linecap="round"/><polygon points="1380,244 1388.6296596948757,259.7964861140267 1371.3703403051243,259.7964861140267" fill="#1E7DB0"/><text x="1380" y="700" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">getting faster</text><text x="1380" y="727" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">air resistance growing</text><text x="1380" y="766" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#0F2A5F">still accelerating</text><text x="1358" y="270" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="end" font-weight="normal" fill="#1E7DB0">air</text><text x="1358" y="294" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="end" font-weight="normal" fill="#1E7DB0">resistance</text><text x="1358" y="590" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="end" font-weight="normal" fill="#7B3A8E">weight</text><circle cx="1670" cy="354" r="22" fill="#FFFFFF" stroke="#141B26" stroke-width="3"/><rect x="1644" y="378" width="52" height="70" rx="10" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><line x1="1644" y1="392" x2="1608" y2="366" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><line x1="1696" y1="392" x2="1732" y2="366" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><line x1="1656" y1="448" x2="1640" y2="492" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><line x1="1684" y1="448" x2="1700" y2="492" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><line x1="1670" y1="500" x2="1670" y2="650" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="1670,650 1661.3703403051243,634.2035138859733 1678.6296596948757,634.2035138859733" fill="#7B3A8E"/><line x1="1670" y1="324" x2="1670" y2="174" stroke="#1E7DB0" stroke-width="6" stroke-linecap="round"/><polygon points="1670,174 1678.6296596948757,189.79648611402672 1661.3703403051243,189.79648611402672" fill="#1E7DB0"/><text x="1670" y="700" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">top speed</text><text x="1670" y="727" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">air resistance = weight</text><text x="1670" y="766" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#0F2A5F">terminal velocity</text><rect x="980" y="820" width="820" height="150" rx="14" fill="#F1E5F4" stroke="#7B3A8E" stroke-width="2"/><text x="1390" y="868" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">Balanced forces: no change in speed or direction.</text><text x="1390" y="900" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">Unbalanced forces: the resultant force changes</text><text x="1390" y="932" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">the speed, the direction or the shape.</text></svg>