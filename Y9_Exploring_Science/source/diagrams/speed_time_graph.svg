y2="690" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><line x1="220" y1="690" x2="220" y2="170" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><text x="670.0" y="770.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">Time (s)</text><text x="130.0" y="430.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26" transform="rotate(-90 130.0 430.0)">Speed (m/s)</text><polyline points="220.0,690.0 400.0,256.66666666666663 760.0,256.66666666666663 940.0,690.0 1120.0,690.0" fill="none" stroke="#141B26" stroke-width="6" stroke-linejoin="round"/><text x="284.0" y="451.3333333333333" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="35" text-anchor="middle" font-weight="bold" fill="#7B3A8E">P</text><text x="580.0" y="234.66666666666663" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="35" text-anchor="middle" font-weight="bold" fill="#7B3A8E">Q</text><text x="876.0" y="451.3333333333333" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="35" text-anchor="middle" font-weight="bold" fill="#7B3A8E">R</text><text x="1030.0" y="668.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="35" text-anchor="middle" font-weight="bold" fill="#7B3A8E">S</text><text x="1230" y="220" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="start" font-weight="normal" fill="#141B26">P  line slopes up:</text><text x="1230" y="256" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="start" font-weight="normal" fill="#141B26">    accelerating (speeding up)</text><text x="1230" y="292" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="start" font-weight="normal" fill="#141B26"></text><text x="1230" y="328" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="start" font-weight="normal" fill="#141B26">Q  horizontal line:</text><text x="1230" y="364" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="start" font-weight="normal" fill="#141B26">    constant speed (10 m/s)</text><text x="1230" y="400" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="start" font-weight="normal" fill="#141B26"></text><text x="1230" y="436" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="start" font-weight="normal" fill="#141B26">R  line slopes down:</text><text x="1230" y="472" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="start" font-weight="normal" fill="#141B26">    decelerating (slowing down)</text><text x="1230" y="508" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="start" font-weight="normal" fill="#141B26"></text><text x="1230" y="544" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="start" font-weight="normal" fill="#141B26">S  line along the axis:</text><text x="1230" y="580" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="start" font-weight="normal" fill="#141B26">    stationary (speed = 0)</text><text x="900" y="840" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#0F2A5F" font-style="italic">A steeper line on a speed-time graph means the speed is changing more quickly.</text></svg>