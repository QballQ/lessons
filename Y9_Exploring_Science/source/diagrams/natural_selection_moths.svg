<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><rect x="0" y="0" width="1600" height="820" fill="#FFFFFF"/><text x="800" y="55" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="40" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Natural selection: the peppered moth near Manchester, 1850 to 1895</text><rect x="60" y="110" width="340" height="560" rx="14" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="230" y="160" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="middle" font-weight="bold" fill="#7B3A8E">1  Variation</text><rect x="180" y="200" width="100" height="300" rx="6" fill="#C9B99A" stroke="#141B26" stroke-width="2"/><ellipse cx="210" cy="250" rx="22" ry="14" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><ellipse cx="260" cy="300" rx="22" ry="14" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><ellipse cx="220" cy="360" rx="22" ry="14" fill="#111111" stroke="#141B26" stroke-width="2"/><ellipse cx="265" cy="420" rx="22" ry="14" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><ellipse cx="210" cy="470" rx="22" ry="14" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><text x="230" y="560" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#141B26">Some moths are pale,</text><text x="230" y="590" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#141B26">a few are dark (genes).</text><rect x="440" y="110" width="340" height="560" rx="14" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><text x="610" y="160" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="middle" font-weight="bold" fill="#7B3A8E">2  Environment changes</text><rect x="560" y="200" width="100" height="300" rx="6" fill="#3A3A3A" stroke="#141B26" stroke-width="2"/><ellipse cx="590" cy="250" rx="22" ry="14" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><ellipse cx="640" cy="300" rx="22" ry="14" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><ellipse cx="600" cy="360" rx="22" ry="14" fill="#111111" stroke="#141B26" stroke-width="2"/><ellipse cx="645" cy="420" rx="22" ry="14" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><ellipse cx="590" cy="470" rx="22" ry="14" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><text x="610" y="560" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#141B26">Factory soot turns the</text><text x="610" y="590" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#141B26">trees black.</text><rect x="820" y="110" width="340" height="560" rx="14" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="990" y="160" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="middle" font-weight="bold" fill="#7B3A8E">3  Selection</text><rect x="940" y="200" width="100" height="300" rx="6" fill="#3A3A3A" stroke="#141B26" stroke-width="2"/><text x="970" y="260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#B00000">x</text><text x="1020" y="310" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#B00000">x</text><ellipse cx="980" cy="360" rx="22" ry="14" fill="#111111" stroke="#141B26" stroke-width="2"/><text x="1025" y="430" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#B00000">x</text><ellipse cx="970" cy="470" rx="22" ry="14" fill="#111111" stroke="#141B26" stroke-width="2"/><text x="990" y="560" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#141B26">Birds spot and eat the pale</text><text x="990" y="590" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#141B26">moths. More dark ones survive.</text><rect x="1200" y="110" width="340" height="560" rx="14" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><text x="1370" y="160" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="middle" font-weight="bold" fill="#7B3A8E">4  Reproduction</text><rect x="1320" y="200" width="100" height="300" rx="6" fill="#3A3A3A" stroke="#141B26" stroke-width="2"/><ellipse cx="1350" cy="250" rx="22" ry="14" fill="#111111" stroke="#141B26" stroke-width="2"/><ellipse cx="1400" cy="300" rx="22" ry="14" fill="#111111" stroke="#141B26" stroke-width="2"/><ellipse cx="1360" cy="360" rx="22" ry="14" fill="#111111" stroke="#141B26" stroke-width="2"/><ellipse cx="1405" cy="420" rx="22" ry="14" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><ellipse cx="1350" cy="470" rx="22" ry="14" fill="#111111" stroke="#141B26" stroke-width="2"/><text x="1370" y="560" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#141B26">Dark moths breed and pass</text><text x="1370" y="590" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#141B26">on their genes. Repeat.</text><text x="800" y="740" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#7B3A8E" font-style="italic">The environment "selects" the moths whose inherited characteristics help them survive and reproduce.</text></svg>