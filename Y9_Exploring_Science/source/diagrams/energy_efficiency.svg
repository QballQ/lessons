<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="800" viewBox="0 0 1800 800"><rect x="0" y="0" width="1800" height="800" fill="#FFFFFF"/><text x="900" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Efficiency: how much of the energy is useful?</text><rect x="190" y="190" width="300" height="192.0" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><polygon points="490,190 680,190 680,178 730,199.6 680,221.2 680,209.2 490,209.2" fill="#F2CE3E" stroke="#141B26" stroke-width="3" stroke-linejoin="round"/><polygon points="317.2,382.0 317.2,472.0 303.2,472.0 403.6,522.0 504,472.0 490,472.0 490,382.0" fill="#FFFFFF" stroke="#141B26" stroke-width="3" stroke-linejoin="round"/><text x="174" y="294.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="end" font-weight="bold" fill="#141B26">60 J in</text><text x="615" y="168" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">6 J useful (light)</text><text x="403.6" y="558.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">54 J wasted (heating)</text><text x="300" y="168" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">Lamp X</text><text x="340" y="622.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="middle" font-weight="bold" fill="#0F2A5F">efficiency = 6 ÷ 60 = 10%</text><rect x="1100" y="190" width="300" height="48.0" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><polygon points="1400,190 1590,190 1590,178 1640,199.6 1590,221.2 1590,209.2 1400,209.2" fill="#F2CE3E" stroke="#141B26" stroke-width="3" stroke-linejoin="round"/><polygon points="1371.2,238.0 1371.2,328.0 1357.2,328.0 1385.6,378.0 1414,328.0 1400,328.0 1400,238.0" fill="#FFFFFF" stroke="#141B26" stroke-width="3" stroke-linejoin="round"/><text x="1084" y="222.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="end" font-weight="bold" fill="#141B26">15 J in</text><text x="1525" y="168" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">6 J useful (light)</text><text x="1385.6" y="414.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">9 J wasted (heating)</text><text x="1210" y="168" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">Lamp Y</text><text x="1250" y="478.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="middle" font-weight="bold" fill="#0F2A5F">efficiency = 6 ÷ 15 = 40%</text><rect x="250" y="690" width="1300" height="76" rx="14" fill="#F1E5F4" stroke="#7B3A8E" stroke-width="2"/><text x="900" y="738" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="middle" font-weight="bold" fill="#141B26">efficiency = useful energy transferred ÷ total energy transferred   (× 100 for a percentage)</text></svg>