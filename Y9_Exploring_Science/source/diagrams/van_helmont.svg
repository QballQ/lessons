<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><rect x="0" y="0" width="1600" height="700" fill="#FFFFFF"/><text x="800" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="40" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Van Helmont's willow tree experiment (1640s)</text><text x="400" y="120" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="35" text-anchor="middle" font-weight="bold" fill="#7B3A8E">Start</text><path d="M 220 560 L 250 420 L 550 420 L 580 560 Z" fill="#E9DFCB" stroke="#141B26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="400" y1="420" x2="400" y2="300" stroke="#6B4F2A" stroke-width="10" stroke-linecap="round"/><circle cx="400" cy="275" r="49.0" fill="#DDEFD8" stroke="#141B26" stroke-width="3"/><text x="400" y="600" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26">90.72 kg of dry soil</text><text x="400" y="640" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">tree: 2.27 kg</text><text x="1200" y="120" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="35" text-anchor="middle" font-weight="bold" fill="#7B3A8E">After 5 years (only water added)</text><path d="M 1020 560 L 1050 420 L 1350 420 L 1380 560 Z" fill="#E9DFCB" stroke="#141B26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="1200" y1="420" x2="1200" y2="240" stroke="#6B4F2A" stroke-width="10" stroke-linecap="round"/><circle cx="1200" cy="215" r="61.0" fill="#DDEFD8" stroke="#141B26" stroke-width="3"/><text x="1200" y="600" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26">90.66 kg of dry soil</text><text x="1200" y="640" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">tree: 76.74 kg</text><line x1="620" y1="350" x2="980" y2="350" stroke="#5B6574" stroke-width="5" stroke-linecap="round"/><polygon points="980,350 964.2035138859733,358.62965969487567 964.2035138859733,341.37034030512433" fill="#5B6574"/><text x="800" y="330" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#5B6574">rainwater only</text><text x="800" y="690" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#0F2A5F" font-style="italic">The soil lost only 0.06 kg, so the extra mass of the tree did not come from the soil.</text></svg>