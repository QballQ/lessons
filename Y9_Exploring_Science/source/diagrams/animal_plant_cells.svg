<svg xmlns="http://www.w3.org/2000/svg" width="2050" height="840" viewBox="0 0 2050 840"><rect x="0" y="0" width="2050" height="840" fill="#FFFFFF"/><text x="1025" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#0F2A5F">An animal cell and a plant cell</text><text x="330" y="110" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="35" text-anchor="middle" font-weight="bold" fill="#141B26">Animal cell (e.g. cheek cell)</text><path d="M 130 420 Q 110 250 260 200 Q 420 140 500 230 Q 600 330 540 500 Q 470 640 310 630 Q 150 620 130 420 Z" fill="#FFFFFF" stroke="#141B26" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="330" cy="410" r="75" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><circle cx="330" cy="410" r="18" fill="#5B6574" stroke="#141B26" stroke-width="1"/><ellipse cx="420" cy="290" rx="34" ry="18" fill="#F6E3D1" stroke="#141B26" stroke-width="2"/><ellipse cx="250" cy="540" rx="34" ry="18" fill="#F6E3D1" stroke="#141B26" stroke-width="2"/><ellipse cx="230" cy="300" rx="34" ry="18" fill="#F6E3D1" stroke="#141B26" stroke-width="2"/><circle cx="230" cy="450" r="9" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><circle cx="470" cy="420" r="9" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><circle cx="452" cy="290" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><line x1="452" y1="290" x2="568" y2="270" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><text x="580" y="266" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">mitochondria: where respiration</text><text x="580" y="292" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">releases energy from glucose</text><circle cx="405" cy="410" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><line x1="405" y1="410" x2="568" y2="380" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><text x="580" y="376" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">nucleus: controls the cell and</text><text x="580" y="402" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">holds the genetic information (DNA)</text><circle cx="556" cy="470" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><line x1="556" y1="470" x2="568" y2="480" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><text x="580" y="476" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">cell membrane: controls what</text><text x="580" y="502" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">goes in and out of the cell</text><circle cx="440" cy="560" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><line x1="440" y1="560" x2="568" y2="580" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><text x="580" y="576" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">cytoplasm: a jelly where the</text><text x="580" y="602" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">cell's chemical reactions happen</text><text x="1290" y="110" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="35" text-anchor="middle" font-weight="bold" fill="#141B26">Plant cell (e.g. leaf cell)</text><rect x="1060" y="160" width="460" height="480" rx="24" fill="#E4EFDA" stroke="#141B26" stroke-width="8"/><rect x="1082" y="182" width="416" height="436" rx="18" fill="#FFFFFF" stroke="#141B26" stroke-width="3"/><rect x="1170" y="300" width="250" height="200" rx="30" fill="#EAF2FA" stroke="#141B26" stroke-width="2"/><text x="1295" y="408" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#5B6574">vacuole</text><circle cx="1150" cy="250" r="52" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><circle cx="1150" cy="250" r="12" fill="#5B6574" stroke="#141B26" stroke-width="1"/><ellipse cx="1120" cy="560" rx="34" ry="21" fill="#CDE6C2" stroke="#141B26" stroke-width="2"/><circle cx="1107" cy="560" r="5" fill="#3C8F3C" stroke="#141B26" stroke-width="1"/><circle cx="1120" cy="560" r="5" fill="#3C8F3C" stroke="#141B26" stroke-width="1"/><circle cx="1133" cy="560" r="5" fill="#3C8F3C" stroke="#141B26" stroke-width="1"/><ellipse cx="1220" cy="585" rx="34" ry="21" fill="#CDE6C2" stroke="#141B26" stroke-width="2"/><circle cx="1207" cy="585" r="5" fill="#3C8F3C" stroke="#141B26" stroke-width="1"/><circle cx="1220" cy="585" r="5" fill="#3C8F3C" stroke="#141B26" stroke-width="1"/><circle cx="1233" cy="585" r="5" fill="#3C8F3C" stroke="#141B26" stroke-width="1"/><ellipse cx="1400" cy="545" rx="34" ry="21" fill="#CDE6C2" stroke="#141B26" stroke-width="2"/><circle cx="1387" cy="545" r="5" fill="#3C8F3C" stroke="#141B26" stroke-width="1"/><circle cx="1400" cy="545" r="5" fill="#3C8F3C" stroke="#141B26" stroke-width="1"/><circle cx="1413" cy="545" r="5" fill="#3C8F3C" stroke="#141B26" stroke-width="1"/><ellipse cx="1460" cy="330" rx="34" ry="21" fill="#CDE6C2" stroke="#141B26" stroke-width="2"/><circle cx="1447" cy="330" r="5" fill="#3C8F3C" stroke="#141B26" stroke-width="1"/><circle cx="1460" cy="330" r="5" fill="#3C8F3C" stroke="#141B26" stroke-width="1"/><circle cx="1473" cy="330" r="5" fill="#3C8F3C" stroke="#141B26" stroke-width="1"/><ellipse cx="1470" cy="455" rx="34" ry="21" fill="#CDE6C2" stroke="#141B26" stroke-width="2"/><circle cx="1457" cy="455" r="5" fill="#3C8F3C" stroke="#141B26" stroke-width="1"/><circle cx="1470" cy="455" r="5" fill="#3C8F3C" stroke="#141B26" stroke-width="1"/><circle cx="1483" cy="455" r="5" fill="#3C8F3C" stroke="#141B26" stroke-width="1"/><ellipse cx="1330" cy="575" rx="30" ry="16" fill="#F6E3D1" stroke="#141B26" stroke-width="2"/><ellipse cx="1320" cy="230" rx="30" ry="16" fill="#F6E3D1" stroke="#141B26" stroke-width="2"/><circle cx="1520" cy="200" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><line x1="1520" y1="200" x2="1568" y2="200" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><text x="1580" y="196" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">cell wall (cellulose): supports the</text><text x="1580" y="222" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">cell and gives it its shape</text><circle cx="1202" cy="250" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><line x1="1202" y1="250" x2="1568" y2="300" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><text x="1580" y="296" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">nucleus: controls the cell and</text><text x="1580" y="322" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">holds the genetic information (DNA)</text><circle cx="1420" cy="380" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><line x1="1420" y1="380" x2="1568" y2="400" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><text x="1580" y="396" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">vacuole: full of cell sap,</text><text x="1580" y="422" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">keeps the cell firm</text><circle cx="1500" cy="455" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><line x1="1500" y1="455" x2="1568" y2="500" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><text x="1580" y="496" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">chloroplasts: contain chlorophyll,</text><text x="1580" y="522" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">which traps light for photosynthesis</text><circle cx="1360" cy="575" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><line x1="1360" y1="575" x2="1568" y2="600" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><text x="1580" y="596" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">mitochondria: where respiration</text><text x="1580" y="622" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">releases energy</text><circle cx="1498" cy="600" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><line x1="1498" y1="600" x2="1568" y2="690" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><text x="1580" y="686" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">cell membrane and cytoplasm:</text><text x="1580" y="712" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#141B26">the same jobs as in the animal cell</text><text x="1025" y="810" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#0F2A5F" font-style="italic">Both cells: nucleus, cytoplasm, cell membrane, mitochondria.   Plant cells only: cell wall, chloroplasts, a large vacuole.</text></svg>