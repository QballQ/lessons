<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560"><rect x="0" y="0" width="1600" height="560" fill="#FFFFFF"/><text x="800" y="55" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Median and quartiles (values must be in order first)</text><rect x="140" y="180" width="80" height="80" rx="10" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="180" y="232" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#141B26">1</text><rect x="265" y="180" width="80" height="80" rx="10" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="305" y="232" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#141B26">2</text><rect x="390" y="180" width="80" height="80" rx="10" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><text x="430" y="232" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#141B26">3</text><rect x="515" y="180" width="80" height="80" rx="10" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="555" y="232" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#141B26">3</text><rect x="640" y="180" width="80" height="80" rx="10" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="680" y="232" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#141B26">4</text><rect x="765" y="180" width="80" height="80" rx="10" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><text x="805" y="232" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#141B26">5</text><rect x="890" y="180" width="80" height="80" rx="10" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="930" y="232" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#141B26">6</text><rect x="1015" y="180" width="80" height="80" rx="10" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="1055" y="232" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#141B26">7</text><rect x="1140" y="180" width="80" height="80" rx="10" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><text x="1180" y="232" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#141B26">7</text><rect x="1265" y="180" width="80" height="80" rx="10" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="1305" y="232" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#141B26">8</text><rect x="1390" y="180" width="80" height="80" rx="10" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="1430" y="232" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#141B26">9</text><line x1="430" y1="360" x2="430" y2="275" stroke="#7B3A8E" stroke-width="5" stroke-linecap="round"/><polygon points="430,275 438.62965969487567,290.7964861140267 421.37034030512433,290.7964861140267" fill="#7B3A8E"/><text x="430" y="400" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#7B3A8E">lower quartile</text><text x="430" y="432" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26">(LQ) = 3</text><line x1="805" y1="360" x2="805" y2="275" stroke="#7B3A8E" stroke-width="5" stroke-linecap="round"/><polygon points="805,275 813.6296596948756,290.7964861140267 796.3703403051244,290.7964861140267" fill="#7B3A8E"/><text x="805" y="400" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#7B3A8E">median</text><text x="805" y="432" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26">(middle value) = 5</text><line x1="1180" y1="360" x2="1180" y2="275" stroke="#7B3A8E" stroke-width="5" stroke-linecap="round"/><polygon points="1180,275 1188.6296596948757,290.7964861140267 1171.3703403051243,290.7964861140267" fill="#7B3A8E"/><text x="1180" y="400" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#7B3A8E">upper quartile</text><text x="1180" y="432" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26">(UQ) = 7</text><text x="800" y="510" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="35" text-anchor="middle" font-weight="normal" fill="#0F2A5F">interquartile range = UQ - LQ = 7 - 3 = 4   (the range of the middle 50% of the data)</text></svg>