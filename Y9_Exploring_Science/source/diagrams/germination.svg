<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><rect x="0" y="0" width="1600" height="760" fill="#FFFFFF"/><text x="800" y="55" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="34" text-anchor="middle" font-weight="bold" fill="#0F2A5F">What happens when a seed germinates</text><ellipse cx="330" cy="420" rx="230" ry="160" fill="#E9DFCB" stroke="#141B26" stroke-width="4"/><text x="330" y="225" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="bold" fill="#141B26">seed</text><ellipse cx="330" cy="420" rx="170" ry="110" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><text x="300" y="415" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#141B26">food store</text><text x="300" y="445" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" fill="#5B6574">(starch and protein)</text><ellipse cx="465" cy="440" rx="40" ry="28" fill="#F1E5F4" stroke="#141B26" stroke-width="2"/><text x="465" y="530" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#141B26">embryo</text><line x1="465" y1="468" x2="465" y2="510" stroke="#141B26" stroke-width="2" stroke-linecap="round"/><line x1="60" y1="340" x2="150" y2="380" stroke="#1E7DB0" stroke-width="6" stroke-linecap="round"/><polygon points="150,380 132.0601518103428,381.47032205045474 139.06982531242292,365.69855667077445" fill="#1E7DB0"/><text x="70" y="320" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#1E7DB0">water in</text><line x1="60" y1="500" x2="150" y2="470" stroke="#5B6574" stroke-width="6" stroke-linecap="round"/><polygon points="150,470 137.74307546253206,483.1821015351429 132.28519944893992,466.80847349436647" fill="#5B6574"/><text x="70" y="540" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#5B6574">oxygen in</text><text x="640" y="230" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="start" font-weight="normal" fill="#141B26">1  Water enters. Molecules can move, so reactions start.</text><text x="640" y="305" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="start" font-weight="normal" fill="#141B26">2  Water triggers the release of enzymes.</text><text x="640" y="380" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="start" font-weight="normal" fill="#141B26">3  Enzymes digest the starch store into glucose (faster when warm).</text><text x="640" y="455" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="start" font-weight="normal" fill="#141B26">4  Glucose reaches the embryo, which respires and grows.</text><text x="640" y="530" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="start" font-weight="normal" fill="#141B26">5  The seedling uses the store until its leaves can photosynthesise.</text><text x="800" y="680" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#7B3A8E" font-style="italic">Enzymes are proteins, made using nitrogen from nitrates.</text></svg>