ion Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#7B3A8E">quadrat</text><text x="620" y="178" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" fill="#7B3A8E">0.5 m x 0.5 m</text><text x="1150" y="170" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#0F2A5F">population size =</text><text x="1150" y="240" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">number counted in sample  x</text><text x="1150" y="300" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">total area of the field</text><line x1="900" y1="320" x2="1400" y2="320" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><text x="1150" y="365" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">area sampled</text><text x="1150" y="460" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#5B6574">e.g. 12 snails in 8 quadrats (8 x 0.25 m² = 2 m²)</text><text x="1150" y="500" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="bold" fill="#7B3A8E">12 x 750 / 2 = 4500 snails</text><text x="1150" y="600" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#5B6574" font-style="italic">Place quadrats at random (not where you expect to find most).</text></svg>