<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1000" viewBox="0 0 2200 1000"><rect x="0" y="0" width="2200" height="1000" fill="#FFFFFF"/><text x="1100" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#0F2A5F">The light microscope</text><rect x="700" y="860" width="560" height="70" rx="14" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><path d="M 1200 860 L 1200 420 Q 1200 330 1110 300 L 1020 280" fill="none" stroke="#141B26" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><rect x="750" y="620" width="420" height="26" rx="4" fill="#FFFFFF" stroke="#141B26" stroke-width="3"/><rect x="820" y="606" width="280" height="14" rx="2" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><rect x="880" y="598" width="160" height="8" rx="2" fill="#DDEFD8" stroke="#141B26" stroke-width="2"/><rect x="775" y="596" width="50" height="10" rx="2" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><rect x="1095" y="596" width="50" height="10" rx="2" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><circle cx="960" cy="760" r="46" fill="#F2CE3E" stroke="#141B26" stroke-width="3"/><text x="960" y="768" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="bold" fill="#141B26">light</text><polygon points="930,690 990,690 980,646 940,646" fill="#EEF1F5" stroke="#141B26" stroke-width="2" stroke-linejoin="round"/><rect x="920" y="150" width="80" height="150" rx="6" fill="#FFFFFF" stroke="#141B26" stroke-width="3"/><rect x="905" y="100" width="110" height="55" rx="8" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><rect x="880" y="300" width="160" height="140" rx="8" fill="#FFFFFF" stroke="#141B26" stroke-width="3"/><polygon points="860,440 1060,440 1040,480 880,480" fill="#EEF1F5" stroke="#141B26" stroke-width="3" stroke-linejoin="round"/><rect x="892" y="480" width="36" height="70" rx="4" fill="#FFFFFF" stroke="#141B26" stroke-width="3"/><text x="910" y="574" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#5B6574">x4</text><rect x="942" y="480" width="36" height="100" rx="4" fill="#FFFFFF" stroke="#141B26" stroke-width="3"/><text x="960" y="604" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#5B6574">x10</text><rect x="1002" y="480" width="36" height="125" rx="4" fill="#FFFFFF" stroke="#141B26" stroke-width="3"/><text x="1020" y="629" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#5B6574">x40</text><circle cx="1200" cy="560" r="44" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><circle cx="1200" cy="560" r="20" fill="#FFFFFF" stroke="#141B26" stroke-width="2"/><line x1="1015" y1="128" x2="1425" y2="110" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><circle cx="1015" cy="128" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><text x="1440" y="118" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#141B26">eyepiece lens (x10): you look through here</text><line x1="1040" y1="370" x2="1425" y2="250" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><circle cx="1040" cy="370" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><text x="1440" y="258" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#141B26">body tube: keeps the lenses the right distance apart</text><line x1="1040" y1="500" x2="1425" y2="390" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><circle cx="1040" cy="500" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><text x="1440" y="398" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#141B26">objective lenses (x4, x10, x40): turn to change</text><line x1="1244" y1="548" x2="1425" y2="520" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><circle cx="1244" cy="548" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><text x="1440" y="528" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#141B26">coarse focus knob: moves the stage a lot</text><line x1="1220" y1="580" x2="1425" y2="580" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><circle cx="1220" cy="580" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><text x="1440" y="588" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#141B26">fine focus knob: small moves to sharpen the image</text><line x1="1170" y1="633" x2="1425" y2="660" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><circle cx="1170" cy="633" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><text x="1440" y="668" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#141B26">stage: the slide rests here, held by the clips</text><line x1="1006" y1="760" x2="1425" y2="760" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><circle cx="1006" cy="760" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><text x="1440" y="768" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#141B26">light source (or mirror): lights the specimen from below</text><line x1="1260" y1="895" x2="1425" y2="895" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><circle cx="1260" cy="895" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><text x="1440" y="903" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#141B26">base: keeps the microscope steady</text><text x="610" y="430" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="end" font-weight="normal" fill="#141B26">arm: carry the microscope</text><text x="610" y="458" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="end" font-weight="normal" fill="#141B26">by the arm, with your</text><text x="610" y="486" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="end" font-weight="normal" fill="#141B26">other hand under the base</text><line x1="620" y1="450" x2="1188" y2="450" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><circle cx="1188" cy="450" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><text x="610" y="614" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="end" font-weight="normal" fill="#141B26">slide with cover slip</text><line x1="620" y1="612" x2="820" y2="612" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><circle cx="820" cy="612" r="6" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><text x="1100" y="975" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#0F2A5F" font-style="italic">Total magnification = eyepiece lens magnification x objective lens magnification, e.g. x10 x x40 = x400</text></svg>