<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="900" viewBox="0 0 1900 900"><rect x="0" y="0" width="1900" height="900" fill="#FFFFFF"/><text x="950" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="40" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Inside an atom: lithium (Li), atomic number 3, mass number 7</text><circle cx="480" cy="450" r="290" fill="none" stroke="#5B6574" stroke-width="2"/><circle cx="480" cy="450" r="150" fill="none" stroke="#5B6574" stroke-width="2"/><circle cx="448" cy="430" r="24" fill="#F2CE3E" stroke="#141B26" stroke-width="2"/><text x="448" y="439" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">+</text><circle cx="512" cy="430" r="24" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><text x="512" y="439" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">n</text><circle cx="480" cy="468" r="24" fill="#F2CE3E" stroke="#141B26" stroke-width="2"/><text x="480" y="477" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">+</text><circle cx="446" cy="486" r="24" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><text x="446" y="495" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">n</text><circle cx="514" cy="486" r="24" fill="#F2CE3E" stroke="#141B26" stroke-width="2"/><text x="514" y="495" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">+</text><circle cx="480" cy="404" r="24" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><text x="480" y="413" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">n</text><circle cx="480" cy="512" r="24" fill="#EEF1F5" stroke="#141B26" stroke-width="2"/><text x="480" y="521" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">n</text><circle cx="480" cy="300" r="14" fill="#FFFFFF" stroke="#141B26" stroke-width="3"/><text x="480" y="307" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">-</text><circle cx="480" cy="600" r="14" fill="#FFFFFF" stroke="#141B26" stroke-width="3"/><text x="480" y="607" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">-</text><circle cx="770" cy="450" r="14" fill="#FFFFFF" stroke="#141B26" stroke-width="3"/><text x="770" y="457" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">-</text><text x="800" y="220" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="start" font-weight="normal" fill="#5B6574">electron shells</text><line x1="795" y1="228" x2="685" y2="245" stroke="#5B6574" stroke-width="2" stroke-linecap="round"/><text x="800" y="458" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="start" font-weight="normal" fill="#141B26">electron (-)</text><text x="160" y="440" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="end" font-weight="bold" fill="#7B3A8E">nucleus:</text><text x="160" y="470" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="end" font-weight="normal" fill="#7B3A8E">3 protons (+)</text><text x="160" y="498" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="end" font-weight="normal" fill="#7B3A8E">4 neutrons (n)</text><line x1="170" y1="460" x2="420" y2="460" stroke="#7B3A8E" stroke-width="2" stroke-linecap="round"/><circle cx="420" cy="460" r="5" fill="#7B3A8E" stroke="#7B3A8E" stroke-width="1"/><text x="480" y="785" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#0F2A5F">electron configuration 2,1</text><rect x="1000" y="150" width="180" height="60" rx="0" fill="#0F2A5F" stroke="#0F2A5F" stroke-width="1"/><text x="1090.0" y="188" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Particle</text><rect x="1180" y="150" width="170" height="60" rx="0" fill="#0F2A5F" stroke="#0F2A5F" stroke-width="1"/><text x="1265.0" y="188" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Where</text><rect x="1350" y="150" width="260" height="60" rx="0" fill="#0F2A5F" stroke="#0F2A5F" stroke-width="1"/><text x="1480.0" y="188" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Relative mass</text><rect x="1610" y="150" width="230" height="60" rx="0" fill="#0F2A5F" stroke="#0F2A5F" stroke-width="1"/><text x="1725.0" y="188" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Relative charge</text><rect x="1000" y="210" width="180" height="64" rx="0" fill="#FFFFFF" stroke="#141B26" stroke-width="1"/><text x="1090.0" y="250" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">proton</text><rect x="1180" y="210" width="170" height="64" rx="0" fill="#FFFFFF" stroke="#141B26" stroke-width="1"/><text x="1265.0" y="250" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">nucleus</text><rect x="1350" y="210" width="260" height="64" rx="0" fill="#FFFFFF" stroke="#141B26" stroke-width="1"/><text x="1480.0" y="250" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">1</text><rect x="1610" y="210" width="230" height="64" rx="0" fill="#FFFFFF" stroke="#141B26" stroke-width="1"/><text x="1725.0" y="250" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">+1</text><rect x="1000" y="274" width="180" height="64" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="1"/><text x="1090.0" y="314" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">neutron</text><rect x="1180" y="274" width="170" height="64" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="1"/><text x="1265.0" y="314" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">nucleus</text><rect x="1350" y="274" width="260" height="64" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="1"/><text x="1480.0" y="314" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">1</text><rect x="1610" y="274" width="230" height="64" rx="0" fill="#EEF1F5" stroke="#141B26" stroke-width="1"/><text x="1725.0" y="314" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">0</text><rect x="1000" y="338" width="180" height="64" rx="0" fill="#FFFFFF" stroke="#141B26" stroke-width="1"/><text x="1090.0" y="378" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">electron</text><rect x="1180" y="338" width="170" height="64" rx="0" fill="#FFFFFF" stroke="#141B26" stroke-width="1"/><text x="1265.0" y="378" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">shells</text><rect x="1350" y="338" width="260" height="64" rx="0" fill="#FFFFFF" stroke="#141B26" stroke-width="1"/><text x="1480.0" y="378" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">almost 0 (1/1840)</text><rect x="1610" y="338" width="230" height="64" rx="0" fill="#FFFFFF" stroke="#141B26" stroke-width="1"/><text x="1725.0" y="378" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#141B26">-1</text><text x="1000" y="460" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#141B26">atomic number = number of protons</text><text x="1000" y="496" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#141B26">(in an atom this also equals the number of electrons)</text><text x="1000" y="532" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#141B26">mass number = protons + neutrons</text><text x="1000" y="568" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#141B26">neutrons = mass number - atomic number</text><text x="1000" y="604" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="normal" fill="#141B26">lithium: 7 - 3 = 4 neutrons</text><rect x="1000" y="680" width="840" height="150" rx="14" fill="#F1E5F4" stroke="#7B3A8E" stroke-width="2"/><text x="1420" y="728" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">Atoms are neutral: the number of electrons (-) equals</text><text x="1420" y="762" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">the number of protons (+).</text><text x="1420" y="796" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">Nearly all the mass is in the nucleus.</text></svg>