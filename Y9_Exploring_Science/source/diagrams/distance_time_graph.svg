<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900"><rect x="0" y="0" width="1800" height="900" fill="#FFFFFF"/><text x="900" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#0F2A5F">A distance-time graph: the gradient is the speed</text><line x1="220.0" y1="760" x2="220.0" y2="160" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><text x="220.0" y="794.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">0</text><line x1="400.0" y1="760" x2="400.0" y2="160" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><text x="400.0" y="794.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">5</text><line x1="580.0" y1="760" x2="580.0" y2="160" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><text x="580.0" y="794.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">10</text><line x1="760.0" y1="760" x2="760.0" y2="160" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><text x="760.0" y="794.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">15</text><line x1="940.0" y1="760" x2="940.0" y2="160" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><text x="940.0" y="794.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">20</text><line x1="1120.0" y1="760" x2="1120.0" y2="160" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><text x="1120.0" y="794.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#141B26">25</text><line x1="220" y1="760.0" x2="1120" y2="760.0" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><text x="204" y="768.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="end" font-weight="normal" fill="#141B26">0</text><line x1="220" y1="610.0" x2="1120" y2="610.0" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><text x="204" y="618.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="end" font-weight="normal" fill="#141B26">20</text><line x1="220" y1="460.0" x2="1120" y2="460.0" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><text x="204" y="468.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="end" font-weight="normal" fill="#141B26">40</text><line x1="220" y1="310.0" x2="1120" y2="310.0" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><text x="204" y="318.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="end" font-weight="normal" fill="#141B26">60</text><line x1="220" y1="160.0" x2="1120" y2="160.0" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><text x="204" y="168.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="end" font-weight="normal" fill="#141B26">80</text><line x1="220" y1="760" x2="1120" y2="760" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><line x1="220" y1="760" x2="220" y2="160" stroke="#141B26" stroke-width="4" stroke-linecap="round"/><text x="670.0" y="840.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26">Time (s)</text><text x="130.0" y="460.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#141B26" transform="rotate(-90 130.0 460.0)">Distance (m)</text><polyline points="220.0,760.0 580.0,460.0 940.0,460.0 1120.0,160.0" fill="none" stroke="#141B26" stroke-width="6" stroke-linejoin="round"/><text x="420.0" y="660.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="35" text-anchor="middle" font-weight="bold" fill="#7B3A8E">A</text><text x="760.0" y="440.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="35" text-anchor="middle" font-weight="bold" fill="#7B3A8E">B</text><text x="990.0" y="300.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="35" text-anchor="middle" font-weight="bold" fill="#7B3A8E">C</text><line x1="940.0" y1="460.0" x2="1120.0" y2="460.0" stroke="#7B3A8E" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round"/><line x1="1120.0" y1="460.0" x2="1120.0" y2="160.0" stroke="#7B3A8E" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round"/><text x="1030.0" y="490.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" fill="#7B3A8E">5 s</text><text x="1134.0" y="318.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" text-anchor="start" font-weight="normal" fill="#7B3A8E">40 m</text><text x="1230" y="230" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="start" font-weight="normal" fill="#141B26">A  shallow line: moving slowly</text><text x="1230" y="268" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="start" font-weight="normal" fill="#141B26">    40 m in 10 s = 4 m/s</text><text x="1230" y="306" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="start" font-weight="normal" fill="#141B26"></text><text x="1230" y="344" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="start" font-weight="normal" fill="#141B26">B  horizontal line: stationary</text><text x="1230" y="382" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="start" font-weight="normal" fill="#141B26">    (not moving)</text><text x="1230" y="420" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="start" font-weight="normal" fill="#141B26"></text><text x="1230" y="458" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="29" text-anchor="start" font-weight="normal" fill="#141B26">C  steep line: moving faster</text><rect x="1210" y="560" width="540" height="200" rx="14" fill="#F1E5F4" stroke="#7B3A8E" stroke-width="2"/><text x="1480" y="610" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">gradient of C</text><text x="1480" y="648" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">= vertical change ÷ horizontal change</text><text x="1480" y="686" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">= 40 m ÷ 5 s</text><text x="1480" y="724" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">= 8 m/s</text></svg>