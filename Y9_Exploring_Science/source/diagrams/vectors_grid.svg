<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="900" viewBox="0 0 1900 900"><rect x="0" y="0" width="1900" height="900" fill="#FFFFFF"/><text x="950" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="42" text-anchor="middle" font-weight="bold" fill="#0F2A5F">Vectors on a grid: finding C = 2A + B</text><line x1="170" y1="760" x2="170" y2="100" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><line x1="280" y1="760" x2="280" y2="100" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><line x1="390" y1="760" x2="390" y2="100" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><line x1="500" y1="760" x2="500" y2="100" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><line x1="610" y1="760" x2="610" y2="100" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><line x1="720" y1="760" x2="720" y2="100" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><line x1="830" y1="760" x2="830" y2="100" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="760" x2="830" y2="760" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="650" x2="830" y2="650" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="540" x2="830" y2="540" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="430" x2="830" y2="430" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="320" x2="830" y2="320" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="210" x2="830" y2="210" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="100" x2="830" y2="100" stroke="#D5DBE3" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="760" x2="870" y2="760" stroke="#141B26" stroke-width="3" stroke-linecap="round"/><polygon points="870,760 854.2035138859733,768.6296596948756 854.2035138859733,751.3703403051244" fill="#141B26"/><line x1="170" y1="760" x2="170" y2="60" stroke="#141B26" stroke-width="3" stroke-linecap="round"/><polygon points="170,60 178.62965969487564,75.7964861140267 161.37034030512433,75.7964861140267" fill="#141B26"/><text x="890" y="770" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26" font-style="italic">x</text><text x="170" y="44" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#141B26" font-style="italic">y</text><line x1="170" y1="760" x2="390" y2="540" stroke="#7B3A8E" stroke-width="3" stroke-dasharray="12 9" stroke-linecap="round"/><line x1="360" y1="570" x2="390" y2="540" stroke="#7B3A8E" stroke-width="3" stroke-linecap="round"/><polygon points="390,540 384.9322884394314,557.2718933397263 372.7281066602738,545.0677115605686" fill="#7B3A8E"/><text x="416" y="586" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#7B3A8E">2A</text><line x1="390" y1="540" x2="500" y2="320" stroke="#1E7DB0" stroke-width="3" stroke-dasharray="12 9" stroke-linecap="round"/><line x1="486" y1="348" x2="500" y2="320" stroke="#1E7DB0" stroke-width="3" stroke-linecap="round"/><polygon points="500,320 500.65419892885376,337.9881078427245 485.21699436850815,330.26950556255167" fill="#1E7DB0"/><text x="485" y="444" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#1E7DB0">B</text><line x1="170" y1="760" x2="280" y2="650" stroke="#7B3A8E" stroke-width="6" stroke-linecap="round"/><polygon points="280,650 274.9322884394314,667.2718933397263 262.7281066602738,655.0677115605686" fill="#7B3A8E"/><text x="314" y="680" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#7B3A8E">A</text><line x1="170" y1="760" x2="280" y2="540" stroke="#1E7DB0" stroke-width="6" stroke-linecap="round"/><polygon points="280,540 280.65419892885376,557.9881078427245 265.21699436850815,550.2695055625517" fill="#1E7DB0"/><text x="246" y="530" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#1E7DB0">B</text><line x1="170" y1="760" x2="500" y2="320" stroke="#141B26" stroke-width="7" stroke-linecap="round"/><polygon points="500,320 497.4258360874845,337.81498470814677 483.61838057568343,327.459393074296" fill="#141B26"/><text x="530" y="310" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="35" text-anchor="middle" font-weight="bold" fill="#141B26">C</text><text x="1030" y="200" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="start" font-weight="normal" fill="#141B26">A = 1 square right, 1 square up</text><text x="1030" y="244" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="start" font-weight="normal" fill="#141B26">B = 1 square right, 2 squares up</text><text x="1030" y="288" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="start" font-weight="normal" fill="#141B26"></text><text x="1030" y="332" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="start" font-weight="normal" fill="#141B26">Multiply: 2A = 2 right, 2 up</text><text x="1030" y="376" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="start" font-weight="normal" fill="#141B26">Add the parts: C = 2A + B</text><text x="1030" y="420" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="start" font-weight="normal" fill="#141B26">right 2 + 1 = 3,  up 2 + 2 = 4</text><text x="1030" y="464" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="start" font-weight="normal" fill="#141B26"></text><text x="1030" y="508" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="start" font-weight="normal" fill="#141B26">Size (magnitude) of C, by Pythagoras:</text><text x="1030" y="552" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" text-anchor="start" font-weight="normal" fill="#141B26">√(3² + 4²) = √25 = 5 squares</text><rect x="1030" y="650" width="800" height="130" rx="14" fill="#F1E5F4" stroke="#7B3A8E" stroke-width="2"/><text x="1430" y="700" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">A vector has a size and a direction, so draw it as an arrow.</text><text x="1430" y="736" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" font-weight="normal" fill="#141B26">To subtract a vector, add it pointing the opposite way.</text></svg>