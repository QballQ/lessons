l decides the group: Na (1 outer electron) is in group 1,</text><text x="950" y="724" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#0F2A5F">Cl (7 outer electrons) is in group 7, and He (full shell) is in group 0.   The number of shells = the period: Na and Cl are in period 3.</text></svg>