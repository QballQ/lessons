<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560"><rect x="0" y="0" width="1600" height="560" fill="#FFFFFF"/><text x="800" y="55" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="34" text-anchor="middle" font-weight="bold" fill="#0F2A5F">How the nervous system responds to a stimulus</text><rect x="40" y="160" width="200" height="150" rx="12" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="140.0" y="244.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#141B26">stimulus</text><text x="140" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" fill="#5B6574">e.g. a sharp pin</text><line x1="243" y1="235" x2="260" y2="235" stroke="#7B3A8E" stroke-width="5" stroke-linecap="round"/><polygon points="260,235 244.20351388597328,243.62965969487564 244.20351388597328,226.37034030512436" fill="#7B3A8E"/><rect x="262" y="160" width="200" height="150" rx="12" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><text x="362.0" y="244.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#141B26">receptor cells</text><text x="362" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" fill="#5B6574">in a sense organ (skin)</text><line x1="465" y1="235" x2="482" y2="235" stroke="#7B3A8E" stroke-width="5" stroke-linecap="round"/><polygon points="482,235 466.2035138859733,243.62965969487564 466.2035138859733,226.37034030512436" fill="#7B3A8E"/><rect x="484" y="160" width="200" height="150" rx="12" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="584.0" y="244.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#141B26">nerve</text><text x="584" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" fill="#5B6574">impulses travel along</text><line x1="687" y1="235" x2="704" y2="235" stroke="#7B3A8E" stroke-width="5" stroke-linecap="round"/><polygon points="704,235 688.2035138859733,243.62965969487564 688.2035138859733,226.37034030512436" fill="#7B3A8E"/><rect x="706" y="160" width="200" height="150" rx="12" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><text x="806.0" y="244.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#141B26">spinal cord</text><text x="806" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" fill="#5B6574">and brain (CNS)</text><line x1="909" y1="235" x2="926" y2="235" stroke="#7B3A8E" stroke-width="5" stroke-linecap="round"/><polygon points="926,235 910.2035138859733,243.62965969487564 910.2035138859733,226.37034030512436" fill="#7B3A8E"/><rect x="928" y="160" width="200" height="150" rx="12" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="1028.0" y="244.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#141B26">nerve</text><text x="1028" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" fill="#5B6574">impulses travel along</text><line x1="1131" y1="235" x2="1148" y2="235" stroke="#7B3A8E" stroke-width="5" stroke-linecap="round"/><polygon points="1148,235 1132.2035138859733,243.62965969487564 1132.2035138859733,226.37034030512436" fill="#7B3A8E"/><rect x="1150" y="160" width="200" height="150" rx="12" fill="#F1E5F4" stroke="#141B26" stroke-width="3"/><text x="1250.0" y="244.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#141B26">effector</text><text x="1250" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" fill="#5B6574">muscle or gland</text><line x1="1353" y1="235" x2="1370" y2="235" stroke="#7B3A8E" stroke-width="5" stroke-linecap="round"/><polygon points="1370,235 1354.2035138859733,243.62965969487564 1354.2035138859733,226.37034030512436" fill="#7B3A8E"/><rect x="1372" y="160" width="200" height="150" rx="12" fill="#EEF1F5" stroke="#141B26" stroke-width="3"/><text x="1472.0" y="244.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#141B26">response</text><text x="1472" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" fill="#5B6574">muscle contracts</text><text x="800" y="450" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#7B3A8E" font-style="italic">Impulses are electrical signals. The brain processes the information and sends impulses out to effectors.</text><text x="800" y="500" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#5B6574">Hormones are chemical messengers: made in glands, carried in the blood, slower but longer lasting.</text></svg>