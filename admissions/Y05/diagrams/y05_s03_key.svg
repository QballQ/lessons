<title>A key. Does it have legs? Yes: does it have 8 legs? Yes: spider. No: beetle. No legs: does it have a shell? Yes: snail. No: earthworm. Below, animal A has 6 legs and a hard back like a beetle. Animal B is long and thin with no legs and no shell, like an earthworm.</title>
