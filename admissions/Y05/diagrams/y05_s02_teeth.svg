<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 258" width="528" height="258" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif">
<title>Three teeth with names and dots: incisor (flat edge), canine (pointed), molar (wide with bumps). On the right, three jobs with dots: tears food, chews and crushes food, cuts food.</title>
<g transform="translate(48 46)"><path d="M -12 4 Q -9 40 0 44 Q 9 40 12 4 Z" fill="#e6e6e6" stroke="#111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M -15 -30 L 15 -30 L 12 4 L -12 4 Z" fill="#fff" stroke="#111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text x="92" y="53" font-size="20" text-anchor="start" fill="#111" font-weight="700">incisor</text><circle cx="226" cy="46" r="7" fill="#111"/><g transform="translate(48 130)"><path d="M -12 4 Q -9 46 0 50 Q 9 46 12 4 Z" fill="#e6e6e6" stroke="#111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M 0 -36 L 15 -12 L 12 4 L -12 4 L -15 -12 Z" fill="#fff" stroke="#111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text x="92" y="137" font-size="20" text-anchor="start" fill="#111" font-weight="700">canine</text><circle cx="226" cy="130" r="7" fill="#111"/><g transform="translate(48 214)"><path d="M -22 4 Q -21 32 -13 38 Q -6 30 -4 10 L 4 10 Q 6 30 13 38 Q 21 32 22 4 Z" fill="#e6e6e6" stroke="#111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M -24 -18 Q -18 -32 -9 -22 Q 0 -32 9 -22 Q 18 -32 24 -18 L 22 4 L -22 4 Z" fill="#fff" stroke="#111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text x="92" y="221" font-size="20" text-anchor="start" fill="#111" font-weight="700">molar</text><circle cx="226" cy="214" r="7" fill="#111"/><circle cx="300" cy="46" r="7" fill="#111"/><text x="318" y="53" font-size="19" text-anchor="start" fill="#111">tears food</text><circle cx="300" cy="130" r="7" fill="#111"/><text x="318" y="137" font-size="19" text-anchor="start" fill="#111">chews and crushes food</text><circle cx="300" cy="214" r="7" fill="#111"/><text x="318" y="221" font-size="19" text-anchor="start" fill="#111">cuts food</text>
</svg>
