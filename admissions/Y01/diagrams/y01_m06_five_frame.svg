<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <title>A five frame: a row of 5 squares, with a dot in each of the first 3 squares and 2 empty squares</title>
  <rect x="10" y="10" width="500" height="100" fill="#fff" stroke="#111" stroke-width="4"/>
  <g stroke="#111" stroke-width="3"><line x1="110" y1="10" x2="110" y2="110"/><line x1="210" y1="10" x2="210" y2="110"/><line x1="310" y1="10" x2="310" y2="110"/><line x1="410" y1="10" x2="410" y2="110"/></g>
  <g fill="#111"><circle cx="60" cy="60" r="34"/><circle cx="160" cy="60" r="34"/><circle cx="260" cy="60" r="34"/></g>
</svg>
