<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" width="600" height="410">
  <title>A tree with three rabbits: one rabbit next to the tree, one rabbit in front of the tree, and one rabbit behind the tree peeping out</title>
  <defs>
    <g id="rabbit">
      <ellipse cx="-36" cy="4" rx="10" ry="10" fill="#fff" stroke="#111" stroke-width="2.5"/>
      <ellipse cx="18" cy="-74" rx="8" ry="25" transform="rotate(-10 18 -74)" fill="#fff" stroke="#111" stroke-width="2.5"/>
      <ellipse cx="36" cy="-72" rx="8" ry="25" transform="rotate(14 36 -72)" fill="#fff" stroke="#111" stroke-width="2.5"/>
      <ellipse cx="0" cy="0" rx="36" ry="31" fill="#fff" stroke="#111" stroke-width="2.5"/>
      <circle cx="27" cy="-34" r="21" fill="#fff" stroke="#111" stroke-width="2.5"/>
      <circle cx="34" cy="-38" r="3" fill="#111"/>
      <circle cx="47" cy="-31" r="3" fill="#7a7a7a"/>
      <ellipse cx="-8" cy="28" rx="24" ry="7" fill="#fff" stroke="#111" stroke-width="2.5"/>
      <ellipse cx="30" cy="26" rx="12" ry="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
    </g>
  </defs>
  <line x1="0" y1="360" x2="600" y2="360" stroke="#111" stroke-width="3"/>
  <g fill="none" stroke="#111" stroke-width="2" stroke-linecap="round">
    <path d="M40 360 l-6 -12 M46 360 l0 -14 M52 360 l6 -12"/><path d="M200 360 l-6 -12 M206 360 l0 -14 M212 360 l6 -12"/>
    <path d="M470 360 l-6 -12 M476 360 l0 -14 M482 360 l6 -12"/><path d="M560 360 l-6 -12 M566 360 l0 -14 M572 360 l6 -12"/>
  </g>
  <!-- rabbit behind the tree: only the head, ears and a paw show at the right edge of the trunk -->
  <g stroke="#111" stroke-width="2.5" fill="#fff">
    <ellipse cx="364" cy="232" rx="8" ry="25" transform="rotate(8 364 232)"/>
    <ellipse cx="382" cy="236" rx="8" ry="25" transform="rotate(26 382 236)"/>
    <circle cx="360" cy="276" r="21"/>
  </g>
  <circle cx="366" cy="272" r="3" fill="#111"/><circle cx="379" cy="279" r="3" fill="#7a7a7a"/>
  <!-- trunk -->
  <path d="M250 362 L265 180 L335 180 L350 362 Z" fill="#bdbdbd" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
  <path d="M290 250 q8 10 0 24 M314 300 q-8 10 0 22" fill="none" stroke="#111" stroke-width="2"/>
  <ellipse cx="346" cy="300" rx="7" ry="11" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <!-- leaves -->
  <g stroke="#111" stroke-width="6" fill="#e6e6e6">
    <circle cx="300" cy="105" r="85"/><circle cx="220" cy="140" r="60"/><circle cx="380" cy="140" r="60"/><circle cx="245" cy="72" r="55"/><circle cx="355" cy="72" r="55"/>
  </g>
  <g fill="#e6e6e6">
    <circle cx="300" cy="105" r="85"/><circle cx="220" cy="140" r="60"/><circle cx="380" cy="140" r="60"/><circle cx="245" cy="72" r="55"/><circle cx="355" cy="72" r="55"/>
  </g>
  <!-- rabbit next to the tree, facing the tree -->
  <use href="#rabbit" x="115" y="330"/>
  <!-- rabbit in front of the tree, facing left -->
  <use href="#rabbit" transform="translate(300 370) scale(-1 1)"/>
</svg>
