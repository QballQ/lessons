<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300">
  <title>A puppy sitting in a cardboard box, with its head and front paws over the edge</title>
  <polygon points="58,140 88,108 40,68 12,100" fill="#e6e6e6" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="58,140 88,108 330,108 300,140" fill="#7a7a7a" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="300,140 330,108 330,258 300,290" fill="#bdbdbd" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="300,140 330,108 352,150 322,182" fill="#e6e6e6" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
  <!-- puppy -->
  <ellipse cx="146" cy="104" rx="16" ry="30" transform="rotate(22 146 104)" fill="#7a7a7a" stroke="#111" stroke-width="3"/>
  <ellipse cx="244" cy="104" rx="16" ry="30" transform="rotate(-22 244 104)" fill="#7a7a7a" stroke="#111" stroke-width="3"/>
  <circle cx="195" cy="92" r="46" fill="#fff" stroke="#111" stroke-width="3"/>
  <ellipse cx="214" cy="80" rx="15" ry="13" fill="#bdbdbd"/>
  <g fill="#111"><circle cx="178" cy="82" r="5"/><circle cx="212" cy="82" r="5"/></g>
  <ellipse cx="195" cy="102" rx="10" ry="7" fill="#111"/>
  <path d="M182 114 Q195 124 208 114" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <path d="M190 119 q0 13 5 13 q5 0 5 -13" fill="#bdbdbd" stroke="#111" stroke-width="2"/>
  <!-- front of the box -->
  <rect x="58" y="140" width="242" height="150" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
  <line x1="58" y1="176" x2="300" y2="176" stroke="#bdbdbd" stroke-width="6"/>
  <rect x="58" y="140" width="242" height="150" fill="none" stroke="#111" stroke-width="3"/>
  <!-- paws over the edge -->
  <g fill="#fff" stroke="#111" stroke-width="3"><ellipse cx="160" cy="144" rx="18" ry="11"/><ellipse cx="230" cy="144" rx="18" ry="11"/></g>
  <g stroke="#111" stroke-width="2" stroke-linecap="round"><path d="M154 146 l0 7 M166 146 l0 7 M224 146 l0 7 M236 146 l0 7"/></g>
