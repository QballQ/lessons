    <path d="M457 60 C455 12 535 12 533 60 L524 47 L514 56 L504 45 L494 56 L484 45 L474 56 L464 47 Z" fill="#7a7a7a" stroke-linejoin="round"/>
  </g>
  <g fill="#111"><circle cx="481" cy="72" r="4.5"/><circle cx="509" cy="72" r="4.5"/></g>
  <path d="M481 87 Q495 98 509 87" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
