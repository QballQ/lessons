  <g fill="none" stroke="#7a7a7a" stroke-width="2"><ellipse cx="165" cy="238" rx="122" ry="54"/><ellipse cx="495" cy="238" rx="122" ry="54"/></g>
  <!-- 4 dumplings on Mei's plate -->
  <use href="#dumpling" x="125" y="226"/><use href="#dumpling" x="205" y="226"/>
  <use href="#dumpling" x="125" y="264"/><use href="#dumpling" x="205" y="264"/>
