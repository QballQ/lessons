<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" width="660" height="270" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif">
<title>A map of Chen Yu's route. From her home, the route crosses a bridge over a river and goes 3.5 cm on the map to a shop. Then it goes 2.5 cm to the park gate, then 3 cm through the park to the lake. The scale is 1 : 50 000. Not drawn accurately.</title>
<defs>
<pattern id="water" width="12" height="12" patternUnits="userSpaceOnUse">
<rect width="12" height="12" fill="#e6e6e6"/>
<path d="M0,6 Q3,3 6,6 T12,6" fill="none" stroke="#7a7a7a" stroke-width="1.2"/>
</pattern>
</defs>
<rect x="2" y="2" width="656" height="266" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
<!-- north arrow -->
<path d="M40,62 L40,22" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
<path d="M32,34 L40,16 L48,34 Z" fill="#111"/>
<text x="40" y="82" font-size="17" font-weight="700" text-anchor="middle" fill="#111">N</text>
<!-- scale box -->
<rect x="16" y="96" width="140" height="34" rx="4" fill="#fff" stroke="#111" stroke-width="1.8"/>
<text x="86" y="119" font-size="17" text-anchor="middle" fill="#111">Scale 1 : 50 000</text>
<!-- river -->
<path d="M172,2 C164,50 182,90 174,140 C166,185 180,225 172,268 L202,268 C210,225 196,185 204,140 C212,90 194,50 202,2 Z" fill="url(#water)" stroke="#111" stroke-width="1.6"/>
<text x="212" y="26" font-size="16" font-style="italic" fill="#111">river</text>
<!-- park -->
<rect x="310" y="30" width="332" height="210" rx="10" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="9 6"/>
<text x="630" y="56" font-size="17" text-anchor="end" fill="#111">Park</text>
<g fill="#bdbdbd" stroke="#111" stroke-width="1.6">
<circle cx="352" cy="62" r="11"/><circle cx="378" cy="54" r="9"/>
<circle cx="356" cy="210" r="10"/><circle cx="384" cy="216" r="9"/>
<circle cx="610" cy="212" r="10"/><circle cx="586" cy="218" r="8"/>
</g>
<!-- lake: left edge at x = 430 -->
<ellipse cx="522" cy="136" rx="92" ry="58" fill="url(#water)" stroke="#111" stroke-width="2.2"/>
<rect x="493" y="122" width="58" height="26" rx="4" fill="#fff"/>
<text x="522" y="141" font-size="18" font-weight="700" text-anchor="middle" fill="#111">Lake</text>
<!-- route, drawn at 40 units for 1 cm on the map:
     home (90,196) to shop (230,196) = 140 = 3.5 cm
     shop (230,196) to park gate (310,136) = 100 = 2.5 cm
     park gate (310,136) to lake (430,136) = 120 = 3 cm -->
<polyline points="90,196 230,196 310,136 430,136" fill="none" stroke="#111" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<!-- bridge over the river -->
<rect x="164" y="186" width="46" height="20" fill="#fff" stroke="#111" stroke-width="2"/>
<line x1="164" y1="196" x2="210" y2="196" stroke="#111" stroke-width="5"/>
<!-- home -->
<path d="M56,180 L79,160 L102,180 Z" fill="#7a7a7a" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<rect x="61" y="180" width="36" height="30" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="73" y="192" width="12" height="18" fill="#bdbdbd" stroke="#111" stroke-width="1.5"/>
<text x="79" y="232" font-size="17" font-weight="700" text-anchor="middle" fill="#111">Home</text>
<!-- shop -->
<rect x="214" y="208" width="32" height="26" fill="#fff" stroke="#111" stroke-width="2"/>
<path d="M210,208 L250,208 L246,216 L214,216 Z" fill="#bdbdbd" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/>
<text x="230" y="254" font-size="17" font-weight="700" text-anchor="middle" fill="#111">Shop</text>
<!-- park gate: two posts on the park edge -->
<rect x="304" y="114" width="12" height="12" fill="#111"/>
<rect x="304" y="146" width="12" height="12" fill="#111"/>
<text x="298" y="106" font-size="17" font-weight="700" text-anchor="end" fill="#111">Park gate</text>
<circle cx="430" cy="136" r="6" fill="#111"/>
<!-- lengths on the map -->
<text x="134" y="182" font-size="17" text-anchor="middle" fill="#111">3.5 cm</text>
<text x="262" y="156" font-size="17" text-anchor="end" fill="#111">2.5 cm</text>
<text x="370" y="124" font-size="17" text-anchor="middle" fill="#111">3 cm</text>
<text x="646" y="260" font-size="15" text-anchor="end" font-style="italic" fill="#111">Not drawn accurately</text>
</svg>
