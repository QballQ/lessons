<text x="229.4" y="96.6" font-size="17" text-anchor="middle" font-weight="700" fill="#111">Bus</text>
<rect x="65.5" y="75.3" width="62" height="24" rx="4" fill="#fff" stroke="none"/>
<text x="96.5" y="94.3" font-size="17" text-anchor="middle" font-weight="700" fill="#111">Metro</text>
<rect x="127.5" y="226.5" width="42" height="24" rx="4" fill="#fff" stroke="none"/>
