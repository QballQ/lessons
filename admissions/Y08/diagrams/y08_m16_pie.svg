<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif">
<title>A pie chart of how 40 students travel to school. Bus is a quarter, marked with a right angle. Metro is the largest sector, marked 135 degrees. Walk and car are the other two sectors.</title>
