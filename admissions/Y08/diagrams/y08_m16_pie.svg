<path d="M170,150 L310,150 A140,140 0 0 0 170,10 Z" fill="#fff" stroke="#111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M170,150 L170,10 A140,140 0 0 0 71,249 Z" fill="#bdbdbd" stroke="#111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M170,150 L71,249 A140,140 0 0 0 213.3,283.1 Z" fill="url(#h1)" stroke="#111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M170,150 L213.3,283.1 A140,140 0 0 0 310,150 Z" fill="#e6e6e6" stroke="#111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M187,150 L187,133 L170,133" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M170,120 A30,30 0 0 0 148.8,171.2" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="88.3" y="144.1" width="48" height="22" rx="3" fill="#fff" stroke="none"/>
