<text x="330" y="206" font-size="17" text-anchor="middle" font-weight="700" fill="#111">main gate</text>
<rect x="44" y="24" width="170" height="60" rx="4" fill="#bdbdbd" stroke="#111" stroke-width="2.5"/>
<text x="129" y="60" font-size="17" text-anchor="middle" font-weight="700" fill="#111">music stage</text>
<rect x="470" y="30" width="150" height="132" rx="4" fill="#e6e6e6" stroke="#111" stroke-width="2.5"/>
<text x="545" y="102" font-size="17" text-anchor="middle" font-weight="700" fill="#111">sports hall</text>
<rect x="250" y="24" width="180" height="50" rx="4" fill="#e6e6e6" stroke="#111" stroke-width="2.5"/>
<text x="340" y="55" font-size="17" text-anchor="middle" font-weight="700" fill="#111">classrooms</text>
<circle cx="110" cy="130" r="12" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="200" cy="130" r="12" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="4 3"/>
