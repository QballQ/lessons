<circle cx="370" cy="130" r="12" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="430" cy="130" r="12" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="4 3"/>
<text x="64" y="160" font-size="15" text-anchor="middle" fill="#111">stalls</text>
<line x1="80" y1="154" x2="98" y2="138" stroke="#111" stroke-width="1.4" stroke-linecap="round"/>
