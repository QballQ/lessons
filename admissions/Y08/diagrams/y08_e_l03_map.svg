<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 214" width="660" height="214" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif">
<title>A plan of the school grounds for the charity fair. The music stage is at the top left. Classrooms are at the top. The sports hall is on the right. The main gate is at the bottom. Letter A is next to the music stage, letter B is by the main gate, letter C is next to the sports hall.</title>
<rect x="20" y="8" width="620" height="172" rx="6" fill="#fff" stroke="#111" stroke-width="3"/>
<rect x="270" y="171" width="120" height="16" fill="#fff" stroke="none"/>
