<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 320" width="330" height="320">
  <title>Titration apparatus. A burette containing hydrochloric acid stands above a conical flask containing 25.0 cm cubed of sodium hydroxide solution on a white tile.</title>
  <rect x="100" y="20" width="20" height="200" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="102" y="70" width="16" height="148" fill="#e6e6e6" stroke="none"/>
  <g stroke="#111" stroke-width="1.2">
    <line x1="100" y1="40" x2="108" y2="40"/><line x1="100" y1="60" x2="108" y2="60"/><line x1="100" y1="80" x2="108" y2="80"/><line x1="100" y1="100" x2="108" y2="100"/>
    <line x1="100" y1="120" x2="108" y2="120"/><line x1="100" y1="140" x2="108" y2="140"/><line x1="100" y1="160" x2="108" y2="160"/><line x1="100" y1="180" x2="108" y2="180"/><line x1="100" y1="200" x2="108" y2="200"/>
  </g>
  <path d="M 100 220 L 106 232 L 114 232 L 120 220" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="98" y="226" width="24" height="8" fill="#7a7a7a" stroke="#111" stroke-width="1.5"/>
  <line x1="110" y1="234" x2="110" y2="252" stroke="#111" stroke-width="2"/>
  <path d="M 95 256 L 95 270 L 60 300 L 160 300 L 125 270 L 125 256 Z" fill="#fff" stroke="#111" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 83 280 L 137 280 L 160 300 L 60 300 Z" fill="#e6e6e6" stroke="none"/>
  <line x1="60" y1="300" x2="160" y2="300" stroke="#111" stroke-width="2.2"/>
  <rect x="40" y="302" width="140" height="10" fill="#bdbdbd" stroke="#111" stroke-width="1.5"/>
  <line x1="122" y1="110" x2="138" y2="110" stroke="#111" stroke-width="1.5"/>
  <text x="144" y="106" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" fill="#111">burette:</text>
  <text x="144" y="126" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" fill="#111">hydrochloric acid</text>
  <line x1="148" y1="288" x2="170" y2="288" stroke="#111" stroke-width="1.5"/>
  <text x="176" y="282" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" fill="#111">conical flask:</text>
  <text x="176" y="302" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" fill="#111">sodium hydroxide</text>
  <text x="110" y="319" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="14" text-anchor="middle" fill="#111">white tile</text>
</svg>
