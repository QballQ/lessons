<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 180" width="330" height="180">
  <title>The displayed formula of a hydrocarbon with three carbon atoms in a chain. There is a double bond between the first and second carbon atoms and a single bond between the second and third. The first carbon has two hydrogen atoms, the second has one and the third has three.</title>
  <g font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#111">
    <text x="70" y="103">C</text><text x="160" y="103">C</text><text x="250" y="103">C</text>
    <text x="70" y="48">H</text><text x="20" y="103">H</text>
    <text x="160" y="48">H</text>
    <text x="250" y="48">H</text><text x="305" y="103">H</text><text x="250" y="160">H</text>
  </g>
  <g stroke="#111" stroke-width="2.4">
    <line x1="84" y1="89" x2="146" y2="89"/><line x1="84" y1="99" x2="146" y2="99"/>
    <line x1="174" y1="94" x2="236" y2="94"/>
    <line x1="70" y1="82" x2="70" y2="56"/><line x1="56" y1="94" x2="34" y2="94"/>
    <line x1="160" y1="82" x2="160" y2="56"/>
    <line x1="250" y1="82" x2="250" y2="56"/><line x1="264" y1="94" x2="290" y2="94"/><line x1="250" y1="108" x2="250" y2="140"/>
  </g>
</svg>
