<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 175" width="460" height="175">
  <title>Two trolleys on a horizontal track. Trolley A, mass 2 kg, moves to the right at 3 m/s towards trolley B, mass 1 kg, which is at rest.</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/></marker>
  </defs>
  <line x1="20" y1="134" x2="440" y2="134" stroke="#111" stroke-width="2.5"/>
  <rect x="60" y="76" width="100" height="40" rx="4" fill="#e6e6e6" stroke="#111" stroke-width="2.2"/>
  <circle cx="82" cy="124" r="9" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="138" cy="124" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="110" y="103" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#111">A   2 kg</text>
  <line x1="166" y1="96" x2="236" y2="96" stroke="#111" stroke-width="3" marker-end="url(#ah)"/>
  <text x="200" y="84" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="middle" fill="#111">3 m/s</text>
  <rect x="290" y="76" width="80" height="40" rx="4" fill="#fff" stroke="#111" stroke-width="2.2"/>
  <circle cx="310" cy="124" r="9" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="350" cy="124" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="330" y="103" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#111">B   1 kg</text>
  <text x="330" y="160" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="middle" fill="#111">at rest</text>
  <text x="110" y="160" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="middle" fill="#111">moving</text>
  <text x="440" y="158" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" text-anchor="end" fill="#111">track</text>
</svg>
