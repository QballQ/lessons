<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 285" width="460" height="285">
  <title>Electrolysis of molten lead(II) bromide. A d.c. power supply is connected by wires to two graphite electrodes that dip into molten lead(II) bromide in a beaker. The electrode on the left is joined to the positive terminal and is labelled positive electrode. The electrode on the right is joined to the negative terminal and is labelled negative electrode.</title>
  <rect x="160" y="20" width="140" height="40" rx="4" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
  <text x="230" y="46" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="middle" fill="#111">d.c. power supply</text>
  <g stroke="#111" stroke-width="2.2" fill="none">
    <polyline points="185,60 185,90 120,90 120,110"/>
    <polyline points="275,60 275,90 340,90 340,110"/>
  </g>
  <text x="172" y="82" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="22" font-weight="700" text-anchor="end" fill="#111">+</text>
  <text x="288" y="82" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#111">&#8722;</text>
  <path d="M 80 140 L 80 250 L 380 250 L 380 140" fill="#fff" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="82" y="170" width="296" height="78" fill="#e6e6e6" stroke="none"/>
  <line x1="82" y1="170" x2="378" y2="170" stroke="#111" stroke-width="1.3"/>
  <rect x="112" y="110" width="16" height="120" fill="#7a7a7a" stroke="#111" stroke-width="2"/>
  <rect x="332" y="110" width="16" height="120" fill="#7a7a7a" stroke="#111" stroke-width="2"/>
  <text x="230" y="215" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="middle" fill="#111">molten lead(II) bromide</text>
  <text x="120" y="276" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="middle" fill="#111">positive electrode</text>
  <text x="340" y="276" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="middle" fill="#111">negative electrode</text>
  <line x1="120" y1="252" x2="120" y2="260" stroke="#111" stroke-width="1.3"/>
  <line x1="340" y1="252" x2="340" y2="260" stroke="#111" stroke-width="1.3"/>
  <text x="358" y="126" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" fill="#111">graphite</text>
  <text x="358" y="146" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" fill="#111">electrodes</text>
  </svg>
