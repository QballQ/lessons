<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 640" width="690" height="640">
  <title>A web page for Harbour Summer Academy: two-week courses for students aged 16 to 18. Dates: Session 1, 6 to 17 July; Session 2, 20 to 31 July. Courses: Engineering Design, university campus, 6800 yuan; Creative Writing, city library, 4500 yuan; Marine Biology, coastal field centre, 7200 yuan; Debating and Public Speaking, university campus, 4500 yuan. Fees include lunch and materials. Accommodation in a shared room costs 2400 yuan extra for students who do not live in the city. How to apply: 1 complete the online form; 2 upload a letter from a teacher; 3 pay a deposit of 500 yuan by 15 May. Places are limited to 20 on each course. Scholarships: ten full scholarships for students whose families cannot pay the fee; write 300 words on why you want to attend; deadline 30 April. Note: students on the Marine Biology course must be able to swim 50 metres.</title>
