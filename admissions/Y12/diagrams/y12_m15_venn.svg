<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="420" height="250">
  <title>A Venn diagram. A rectangle labelled with the universal set symbol contains two overlapping circles labelled P (Physics) and C (Chemistry). All four regions are empty for the student to fill in.</title>
  <rect x="10" y="10" width="400" height="230" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <circle cx="160" cy="130" r="88" fill="none" stroke="#111" stroke-width="2.5"/>
  <circle cx="260" cy="130" r="88" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="24" y="36" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="22" text-anchor="start" font-weight="700" font-style="italic" fill="#111">ξ</text>
  <text x="100" y="50" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="22" text-anchor="middle" font-weight="700" fill="#111">P</text>
  <text x="322" y="50" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="22" text-anchor="middle" font-weight="700" fill="#111">C</text>
</svg>
