<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="440" height="250">
  <title>An alveolus (a small air sac in the lung) drawn as a rounded shape with a very thin wall, with a blood capillary running down its right side. Arrows show oxygen moving from the air in the alveolus into the blood and carbon dioxide moving from the blood into the alveolus. Labels: air in, air, alveolus wall (one cell thick), capillary, blood.</title>
  <path d="M 120 20 L 120 62 Q 50 72 50 140 Q 50 212 130 212 Q 210 212 210 140 Q 210 72 150 62 L 150 20 Z" fill="#fff" stroke="#111" stroke-width="2.2"/>
  <path d="M 236 20 Q 238 100 228 140 Q 220 180 234 230 L 268 230 Q 254 180 262 140 Q 272 100 270 20 Z" fill="#e6e6e6" stroke="#111" stroke-width="2.2"/>
  <ellipse cx="252" cy="60" rx="10" ry="6" fill="#7a7a7a" stroke="#111" stroke-width="1.2"/>
  <ellipse cx="250" cy="100" rx="10" ry="6" fill="#7a7a7a" stroke="#111" stroke-width="1.2"/>
  <ellipse cx="245" cy="140" rx="10" ry="6" fill="#7a7a7a" stroke="#111" stroke-width="1.2"/>
  <ellipse cx="242" cy="180" rx="10" ry="6" fill="#7a7a7a" stroke="#111" stroke-width="1.2"/>
  <ellipse cx="248" cy="215" rx="10" ry="6" fill="#7a7a7a" stroke="#111" stroke-width="1.2"/>
  <line x1="150" y1="118" x2="236" y2="118" stroke="#111" stroke-width="2.5"/><path d="M 234 112 L 244 118 L 234 124 Z" fill="#111"/>
  <line x1="236" y1="162" x2="162" y2="162" stroke="#111" stroke-width="2.5"/><path d="M 164 156 L 154 162 L 164 168 Z" fill="#111"/>
  <text x="165" y="108" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="14" text-anchor="middle" fill="#111">oxygen</text>
  <text x="150" y="184" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="14" text-anchor="middle" fill="#111">carbon dioxide</text>
  <text x="100" y="146" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#111">air</text>
  <text x="135" y="14" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="14" text-anchor="middle" fill="#111">air in</text>
  <text x="290" y="70" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="start" fill="#111">capillary</text>
  <line x1="270" y1="70" x2="284" y2="70" stroke="#111" stroke-width="1.3"/>
  <text x="290" y="205" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="start" fill="#111">blood</text>
  <line x1="262" y1="205" x2="284" y2="205" stroke="#111" stroke-width="1.3"/>
  <text x="10" y="242" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" text-anchor="start" fill="#111">alveolus wall (one cell thick)</text>
  <line x1="58" y1="180" x2="44" y2="228" stroke="#111" stroke-width="1.3"/>
</svg>
