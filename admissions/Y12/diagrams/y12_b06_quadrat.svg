<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 222" width="460" height="222">
  <title>A square field 20 m by 20 m with ten small quadrats placed at random positions. One quadrat is shown enlarged on the right: a square 0.5 m by 0.5 m with four dandelion plants inside it.</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/></marker>
  </defs>
  <rect x="20" y="40" width="180" height="180" fill="#f4f4f4" stroke="#111" stroke-width="2.5"/>
  <line x1="20" y1="24" x2="200" y2="24" stroke="#111" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="110" y="17" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="middle" fill="#111">20 m</text>
  <line x1="216" y1="40" x2="216" y2="220" stroke="#111" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="234" y="130" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="middle" fill="#111" transform="rotate(-90 234 130)">20 m</text>
  <g fill="#7a7a7a" stroke="#111" stroke-width="1.4">
    <rect x="40" y="65" width="7" height="7"/><rect x="110" y="52" width="7" height="7"/><rect x="172" y="88" width="7" height="7"/>
    <rect x="64" y="124" width="7" height="7"/><rect x="136" y="142" width="7" height="7"/><rect x="180" y="168" width="7" height="7"/>
    <rect x="36" y="186" width="7" height="7"/><rect x="100" y="198" width="7" height="7"/><rect x="156" y="114" width="7" height="7"/><rect x="82" y="158" width="7" height="7"/>
  </g>
  <line x1="179" y1="95" x2="280" y2="120" stroke="#111" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="280" y="60" width="120" height="120" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <line x1="280" y1="46" x2="400" y2="46" stroke="#111" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="340" y="39" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="middle" fill="#111">0.5 m</text>
  <line x1="414" y1="60" x2="414" y2="180" stroke="#111" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="432" y="120" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="middle" fill="#111" transform="rotate(-90 432 120)">0.5 m</text>
  <g stroke="#111" stroke-width="1.6" fill="#bdbdbd">
    <circle cx="310" cy="95" r="9"/><circle cx="372" cy="85" r="9"/><circle cx="322" cy="155" r="9"/><circle cx="375" cy="142" r="9"/>
  </g>
  <g stroke="#111" stroke-width="1.4" fill="none">
    <path d="M 310 95 m -14 0 l 28 0 m -14 -14 l 0 28 m -10 -24 l 20 20 m -20 0 l 20 -20"/>
    <path d="M 372 85 m -14 0 l 28 0 m -14 -14 l 0 28 m -10 -24 l 20 20 m -20 0 l 20 -20"/>
    <path d="M 322 155 m -14 0 l 28 0 m -14 -14 l 0 28 m -10 -24 l 20 20 m -20 0 l 20 -20"/>
    <path d="M 375 142 m -14 0 l 28 0 m -14 -14 l 0 28 m -10 -24 l 20 20 m -20 0 l 20 -20"/>
  </g>
  <text x="340" y="208" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="middle" fill="#111">one quadrat (4 dandelions)</text>
</svg>
