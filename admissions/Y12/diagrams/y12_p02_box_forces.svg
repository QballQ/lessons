<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 170" width="460" height="170">
  <title>A box of mass 10 kg on a horizontal floor. A pulling force of 50 N acts to the right. A friction force of 20 N acts to the left.</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/></marker>
  </defs>
  <line x1="20" y1="140" x2="440" y2="140" stroke="#111" stroke-width="2.5"/>
  <g stroke="#7a7a7a" stroke-width="1.3">
    <line x1="30" y1="140" x2="20" y2="152"/><line x1="60" y1="140" x2="50" y2="152"/><line x1="90" y1="140" x2="80" y2="152"/><line x1="120" y1="140" x2="110" y2="152"/>
    <line x1="150" y1="140" x2="140" y2="152"/><line x1="180" y1="140" x2="170" y2="152"/><line x1="210" y1="140" x2="200" y2="152"/><line x1="240" y1="140" x2="230" y2="152"/>
    <line x1="270" y1="140" x2="260" y2="152"/><line x1="300" y1="140" x2="290" y2="152"/><line x1="330" y1="140" x2="320" y2="152"/><line x1="360" y1="140" x2="350" y2="152"/>
    <line x1="390" y1="140" x2="380" y2="152"/><line x1="420" y1="140" x2="410" y2="152"/>
  </g>
  <rect x="190" y="60" width="100" height="80" fill="#e6e6e6" stroke="#111" stroke-width="2.5"/>
  <text x="240" y="107" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#111">10 kg</text>
  <line x1="292" y1="100" x2="402" y2="100" stroke="#111" stroke-width="3" marker-end="url(#ah)"/>
  <text x="346" y="88" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="middle" fill="#111">pull 50 N</text>
  <line x1="188" y1="100" x2="70" y2="100" stroke="#111" stroke-width="3" marker-end="url(#ah)"/>
  <text x="128" y="88" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="middle" fill="#111">friction 20 N</text>
  <text x="440" y="166" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="end" fill="#111">floor</text>
</svg>
