<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" width="460" height="270">
  <title>A reaction profile. Energy is on the vertical axis and progress of reaction on the horizontal axis. The curve starts at the level of the reactants, rises to a peak, then falls to the level of the products, which is lower than the reactants. Arrow A goes up from the reactants level to the peak. Arrow B goes down from the reactants level to the products level.</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/></marker></defs>
  <line x1="70" y1="220" x2="440" y2="220" stroke="#111" stroke-width="2.2" marker-end="url(#ah)"/>
  <line x1="70" y1="220" x2="70" y2="20" stroke="#111" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="255.0" y="248" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#111">Progress of reaction</text>
  <text x="22" y="120.0" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#111" transform="rotate(-90 22 120.0)">Energy</text>
  <path d="M 80 130 L 150 130 C 190 130 200 50 240 50 C 280 50 290 180 330 180 L 420 180" fill="none" stroke="#111" stroke-width="3.5"/>
  <text x="116" y="120" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" text-anchor="middle" fill="#111">reactants</text>
  <text x="380" y="202" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" text-anchor="middle" fill="#111">products</text>
  <line x1="150" y1="130" x2="420" y2="130" stroke="#111" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="240" y1="50" x2="300" y2="50" stroke="#111" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="270" y1="130" x2="270" y2="52" stroke="#111" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="282" y="96.0" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" font-weight="700" fill="#111">A</text>
  <line x1="390" y1="130" x2="390" y2="178" stroke="#111" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="402" y="161.0" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" font-weight="700" fill="#111">B</text>
</svg>
