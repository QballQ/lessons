<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 250" width="330" height="250">
  <title>A Punnett square. The gametes from parent 1 (P and p) are across the top. The gametes from parent 2 (P and p) are down the left side. The top left cell is filled in with PP. The other three cells are empty.</title>
  <text x="200" y="26" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" text-anchor="middle" fill="#111">gametes from parent 1</text>
  <text x="22" y="160" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" text-anchor="middle" fill="#111" transform="rotate(-90 22 160)">gametes from parent 2</text>
  <rect x="110" y="40" width="90" height="40" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
  <rect x="200" y="40" width="90" height="40" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
  <rect x="50" y="80" width="60" height="80" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
  <rect x="50" y="160" width="60" height="80" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
  <rect x="110" y="80" width="90" height="80" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="200" y="80" width="90" height="80" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="110" y="160" width="90" height="80" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="200" y="160" width="90" height="80" fill="#fff" stroke="#111" stroke-width="2"/>
  <g font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#111">
    <text x="155" y="68">P</text><text x="245" y="68">p</text>
    <text x="80" y="128">P</text><text x="80" y="208">p</text>
    <text x="155" y="128">PP</text>
  </g>
</svg>
