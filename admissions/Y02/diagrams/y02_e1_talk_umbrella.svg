<title>A picture story in four parts. 1: Jun walks to school in the sunshine with his school bag. 2: Dark clouds come and it rains; Jun holds his bag over his head and is sad. 3: His friend Mei holds her umbrella over them both. 4: They arrive at school, the sun comes out and there is a rainbow; they wave and smile.</title>
