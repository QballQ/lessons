<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" width="400" height="330">
  <title>A labelled diagram of a kite: the sail, the frame (two crossed sticks), the tail at the bottom with bows, and the string.</title>
  <g font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" fill="#111">
    <polygon points="150,50 220,120 150,240 80,120" fill="#e6e6e6" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="150,50 150,120 80,120" fill="#bdbdbd" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="150,120 220,120 150,240" fill="#bdbdbd" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <line x1="150" y1="50" x2="150" y2="240" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <line x1="80" y1="120" x2="220" y2="120" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <path d="M 150 240 Q 128 262 144 284 Q 160 306 142 326" fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <polygon points="146,280 134,272 134,288" fill="#7a7a7a" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="146,280 158,272 158,288" fill="#7a7a7a" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="144,322 132,314 132,330" fill="#7a7a7a" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="144,322 156,314 156,330" fill="#7a7a7a" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 150 120 Q 210 240 300 316" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1 0"/>
    <line x1="180" y1="90" x2="270" y2="50" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="180" cy="90" r="3" fill="#111" stroke="#111" stroke-width="1"/>
    <text x="276" y="56" font-size="19" text-anchor="start" font-weight="700">sail</text>
    <line x1="200" y1="120" x2="270" y2="110" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="200" cy="120" r="3" fill="#111" stroke="#111" stroke-width="1"/>
    <text x="276" y="116" font-size="19" text-anchor="start" font-weight="700">frame</text>
    <line x1="144" y1="286" x2="90" y2="286" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="144" cy="286" r="3" fill="#111" stroke="#111" stroke-width="1"/>
    <text x="84" y="292" font-size="19" text-anchor="end" font-weight="700">tail</text>
    <line x1="260" y1="288" x2="300" y2="250" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="260" cy="288" r="3" fill="#111" stroke="#111" stroke-width="1"/>
    <text x="306" y="256" font-size="19" text-anchor="start" font-weight="700">string</text>
  </g>
</svg>
