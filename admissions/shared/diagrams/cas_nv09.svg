  <title>Odd one out. Five flag figures: a rod with a grey triangular flag at one end and a black ball at the other. B, C, D and E are the same figure turned by 0, 90, 180 and 270 degrees. A is the mirror image: with the ball at the bottom, its flag points left instead of right.</title>
