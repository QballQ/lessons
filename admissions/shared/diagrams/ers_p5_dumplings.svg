<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="340" height="180">
  <title>A plate of steaming dumplings with a pair of chopsticks</title>
  <defs>
    <g id="dumpling">
      <path d="M-30 8 C-30 -16 30 -16 30 8 Q0 15 -30 8 Z" fill="#fff"/>
      <path d="M-22 -3 Q-19 -11 -14 -8 Q-10 -14 -5 -10 Q0 -16 5 -10 Q10 -14 14 -8 Q19 -11 22 -3" fill="none" stroke-width="1.8"/>
    </g>
  </defs>
  <g stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- steam -->
    <path d="M128 62 Q120 52 128 42 Q136 32 128 22 M170 56 Q162 46 170 36 Q178 26 170 16 M212 62 Q204 52 212 42 Q220 32 212 22" fill="none" stroke-width="2"/>
    <!-- plate -->
    <ellipse cx="170" cy="118" rx="150" ry="54" fill="#fff"/>
    <ellipse cx="170" cy="118" rx="118" ry="40" fill="#e6e6e6" stroke-width="1.6"/>
    <!-- dumplings, back row then front row -->
    <use href="#dumpling" x="118" y="102"/>
    <use href="#dumpling" x="172" y="96"/>
    <use href="#dumpling" x="226" y="102"/>
    <use href="#dumpling" x="92" y="126"/>
    <use href="#dumpling" x="148" y="128"/>
    <use href="#dumpling" x="204" y="128"/>
    <!-- chopsticks -->
    <path d="M238 166 L334 104 L337 109 L242 171 Z" fill="#7a7a7a" stroke-width="1.8"/>
    <path d="M226 160 L326 92 L329 97 L230 165 Z" fill="#7a7a7a" stroke-width="1.8"/>
  </g>
</svg>
