<text x="76" y="158" font-size="17" text-anchor="middle" font-weight="700" fill="#111">torch</text>
<circle cx="270" cy="99" r="7" fill="#111" stroke="none"/>
<path d="M261,108 L279,108 L283,132 L257,132 Z" fill="#111" stroke="none"/>
<line x1="270" y1="132" x2="270" y2="186" stroke="#111" stroke-width="3" stroke-linecap="round"/>
