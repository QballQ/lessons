<circle cx="583" cy="73.2" r="15.7" fill="#7a7a7a" stroke="none"/>
<path d="M562.8,100.1 L603.2,100.1 L612.1,171.7 L553.9,171.7 Z" fill="#7a7a7a" stroke="none"/>
<text x="583" y="16" font-size="17" text-anchor="middle" font-weight="700" fill="#111">screen</text>
