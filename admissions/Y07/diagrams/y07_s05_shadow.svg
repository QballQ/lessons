<text x="270" y="80" font-size="17" text-anchor="middle" font-weight="700" fill="#111">puppet</text>
<rect x="556" y="22" width="54" height="190" fill="#fff" stroke="#111" stroke-width="2.5"/>
<line x1="126" y1="112" x2="556" y2="52.3" stroke="#555" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5"/>
