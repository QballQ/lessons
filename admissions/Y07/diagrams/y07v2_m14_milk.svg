<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 244" width="300" height="244" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif">
<title>Two milk cartons. Carton A holds 750 ml and costs 12.60 yuan. Carton B is bigger: it holds 1.2 litres and costs 19.20 yuan.</title>
<rect x="61" y="38" width="22" height="9" fill="#e6e6e6" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<polygon points="32,72 72,46 112,72" fill="#e6e6e6" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="32" y="72" width="80" height="104" fill="#fff" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
<text x="72" y="98" font-size="15" text-anchor="middle" font-weight="700" fill="#111">MILK</text>
<text x="72" y="142.72" font-size="17" text-anchor="middle" font-weight="700" fill="#111">750 ml</text>
<text x="72" y="200" font-size="16" text-anchor="middle" font-weight="700" fill="#111">Carton A</text>
<rect x="34" y="208" width="76" height="30" rx="5" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="72" y="229" font-size="18" text-anchor="middle" font-weight="700" fill="#111">¥12.60</text>
<rect x="211" y="12" width="22" height="9" fill="#e6e6e6" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<polygon points="172,50 222,20 272,50" fill="#e6e6e6" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="172" y="50" width="100" height="126" fill="#fff" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
<text x="222" y="76" font-size="15" text-anchor="middle" font-weight="700" fill="#111">MILK</text>
<text x="222" y="135.68" font-size="17" text-anchor="middle" font-weight="700" fill="#111">1.2 litres</text>
<text x="222" y="200" font-size="16" text-anchor="middle" font-weight="700" fill="#111">Carton B</text>
<rect x="184" y="208" width="76" height="30" rx="5" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="222" y="229" font-size="18" text-anchor="middle" font-weight="700" fill="#111">¥19.20</text>
</svg>
