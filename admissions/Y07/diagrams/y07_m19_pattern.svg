<line x1="392" y1="22" x2="436" y2="22" stroke="#111" stroke-width="6" stroke-linecap="round"/>
<line x1="392" y1="78" x2="436" y2="78" stroke="#111" stroke-width="6" stroke-linecap="round"/>
