<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 618" width="660" height="618">
  <title>Menu of Lotus Café with opening hours, noodle and rice dishes, snacks and drinks with prices, a key for vegetarian and spicy dishes, a student deal and a note about allergies.</title>
  <rect x="2" y="2" width="656" height="614" rx="14" fill="#fff" stroke="#111" stroke-width="3"/>
  <path d="M 2 16 A 14 14 0 0 1 16 2 L 644 2 A 14 14 0 0 1 658 16 L 658 88 L 2 88 Z" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
  <text x="330" y="44" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="32" text-anchor="middle" font-weight="700" fill="#111">Lotus Café</text>
  <text x="330" y="74" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" text-anchor="middle" fill="#111">Fresh noodles, rice and snacks, made every day</text>
  <text x="24" y="122" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" font-weight="700" fill="#111">Opening hours</text>
  <text x="24" y="148" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" fill="#111">Monday to Friday: 7:30 to 20:00</text>
  <text x="24" y="174" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" fill="#111">Saturday and Sunday: 9:00 to 21:00</text>
  <line x1="20" y1="192" x2="400" y2="192" stroke="#111" stroke-width="1.5"/>
  <text x="24" y="222" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="20" font-weight="700" fill="#111">Noodles and rice</text>
  <text x="30" y="252" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" fill="#111">Beef noodle soup</text>
  <g transform="translate(268 246)" stroke="#111" stroke-width="1.8" stroke-linejoin="round"><path d="M 2 -4 C 8 -6 16 -2 20 8 C 12 6 4 2 2 -4 Z" fill="#111"/><path d="M 2 -4 L -2 -9" fill="none"/></g>
  <text x="392" y="252" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" text-anchor="end" fill="#111">¥32</text>
  <text x="30" y="280" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" fill="#111">Tomato and egg noodles</text>
  <g transform="translate(268 274)" stroke="#111" stroke-width="1.8" stroke-linejoin="round"><path d="M 0 8 C 0 -2 8 -8 18 -8 C 18 2 10 8 0 8 Z" fill="#bdbdbd"/><path d="M 0 8 L 11 -2" fill="none"/></g>
  <text x="392" y="280" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" text-anchor="end" fill="#111">¥24</text>
  <text x="30" y="308" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" fill="#111">Chicken fried rice</text>
  <text x="392" y="308" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" text-anchor="end" fill="#111">¥28</text>
  <text x="30" y="336" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" fill="#111">Vegetable fried rice</text>
  <g transform="translate(268 330)" stroke="#111" stroke-width="1.8" stroke-linejoin="round"><path d="M 0 8 C 0 -2 8 -8 18 -8 C 18 2 10 8 0 8 Z" fill="#bdbdbd"/><path d="M 0 8 L 11 -2" fill="none"/></g>
  <text x="392" y="336" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" text-anchor="end" fill="#111">¥22</text>
  <text x="30" y="364" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" fill="#111">Spicy tofu with rice</text>
  <g transform="translate(268 358)" stroke="#111" stroke-width="1.8" stroke-linejoin="round"><path d="M 0 8 C 0 -2 8 -8 18 -8 C 18 2 10 8 0 8 Z" fill="#bdbdbd"/><path d="M 0 8 L 11 -2" fill="none"/></g>
  <g transform="translate(294 358)" stroke="#111" stroke-width="1.8" stroke-linejoin="round"><path d="M 2 -4 C 8 -6 16 -2 20 8 C 12 6 4 2 2 -4 Z" fill="#111"/><path d="M 2 -4 L -2 -9" fill="none"/></g>
  <text x="392" y="364" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" text-anchor="end" fill="#111">¥26</text>
  <text x="24" y="406" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="20" font-weight="700" fill="#111">Snacks</text>
  <text x="30" y="436" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" fill="#111">Pork dumplings (8)</text>
  <text x="392" y="436" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" text-anchor="end" fill="#111">¥18</text>
  <text x="30" y="464" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" fill="#111">Spring rolls (4)</text>
  <g transform="translate(268 458)" stroke="#111" stroke-width="1.8" stroke-linejoin="round"><path d="M 0 8 C 0 -2 8 -8 18 -8 C 18 2 10 8 0 8 Z" fill="#bdbdbd"/><path d="M 0 8 L 11 -2" fill="none"/></g>
  <text x="392" y="464" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" text-anchor="end" fill="#111">¥15</text>
  <text x="24" y="506" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="20" font-weight="700" fill="#111">Drinks</text>
  <text x="30" y="536" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" fill="#111">Milk tea</text>
  <text x="392" y="536" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" text-anchor="end" fill="#111">¥14</text>
  <text x="30" y="564" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" fill="#111">Orange juice</text>
  <text x="392" y="564" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" text-anchor="end" fill="#111">¥16</text>
  <text x="30" y="592" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" fill="#111">Water</text>
  <text x="392" y="592" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" text-anchor="end" fill="#111">¥5</text>
  <rect x="420" y="104" width="218" height="114" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="434" y="130" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" font-weight="700" fill="#111">Key</text>
  <g transform="translate(436 154)" stroke="#111" stroke-width="1.8" stroke-linejoin="round"><path d="M 0 8 C 0 -2 8 -8 18 -8 C 18 2 10 8 0 8 Z" fill="#bdbdbd"/><path d="M 0 8 L 11 -2" fill="none"/></g>
  <text x="464" y="160" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" fill="#111">vegetarian</text>
  <text x="464" y="181" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" fill="#111">(no meat or fish)</text>
  <g transform="translate(438 198)" stroke="#111" stroke-width="1.8" stroke-linejoin="round"><path d="M 2 -4 C 8 -6 16 -2 20 8 C 12 6 4 2 2 -4 Z" fill="#111"/><path d="M 2 -4 L -2 -9" fill="none"/></g>
  <text x="464" y="205" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" fill="#111">spicy</text>
  <rect x="420" y="234" width="218" height="196" rx="8" fill="#e6e6e6" stroke="#111" stroke-width="2.5"/>
  <text x="434" y="264" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="20" font-weight="700" fill="#111">Student deal</text>
  <text x="434" y="289" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" fill="#111">Any noodle dish</text>
  <text x="434" y="314" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" font-weight="700" fill="#111">+ any drink = ¥35</text>
  <text x="434" y="339" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" fill="#111">Monday to Friday,</text>
  <text x="434" y="364" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" fill="#111">14:00 to 17:00</text>
  <text x="434" y="389" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" fill="#111">Show your student</text>
  <text x="434" y="414" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" fill="#111">card.</text>
  <rect x="420" y="446" width="218" height="104" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="434" y="476" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" font-weight="700" fill="#111">Allergies?</text>
  <text x="434" y="501" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" fill="#111">Please tell our staff</text>
  <text x="434" y="526" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" fill="#111">before you order.</text>
