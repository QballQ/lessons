<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 290" width="470" height="290">
  <title>A tree diagram for Monday and Tuesday. The bus is late or not late on each day. Late on Monday is 0.2. Late on Tuesday after late on Monday is 0.2. The other four probabilities are empty boxes.</title>
  <text x="150" y="20" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#111">Monday</text>
  <text x="350" y="20" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#111">Tuesday</text>
  <line x1="40" y1="150" x2="196" y2="80" stroke="#111" stroke-width="2.2"/>
  <line x1="40" y1="150" x2="196" y2="220" stroke="#111" stroke-width="2.2"/>
  <text x="204" y="86" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" fill="#111">Late</text>
  <text x="204" y="226" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" fill="#111">Not late</text>
  <text x="112" y="104" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#111">0.2</text>
  <rect x="96" y="191" width="48" height="28" rx="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="248" y1="80" x2="376" y2="44" stroke="#111" stroke-width="2.2"/>
  <text x="384" y="50" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" fill="#111">Late</text>
  <line x1="248" y1="80" x2="376" y2="116" stroke="#111" stroke-width="2.2"/>
  <text x="384" y="122" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" fill="#111">Not late</text>
  <line x1="276" y1="220" x2="376" y2="184" stroke="#111" stroke-width="2.2"/>
  <text x="384" y="190" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" fill="#111">Late</text>
  <line x1="276" y1="220" x2="376" y2="256" stroke="#111" stroke-width="2.2"/>
  <text x="384" y="262" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" fill="#111">Not late</text>
  <text x="306" y="54" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#111">0.2</text>
  <rect x="282.0" y="101.0" width="48" height="28" rx="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="292.0" y="173.0" width="48" height="28" rx="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="296.0" y="241.0" width="48" height="28" rx="4" fill="#fff" stroke="#111" stroke-width="2"/>
</svg>
