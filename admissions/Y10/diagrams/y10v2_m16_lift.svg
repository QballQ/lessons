  <rect x="176" y="45" width="66" height="40" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="209.0" y="71.0" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#111">75 kg</text>
