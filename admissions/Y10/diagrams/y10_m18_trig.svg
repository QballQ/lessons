<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 408 204" width="408" height="204">
  <title>Two right-angled triangles. Triangle A: the angle 35 degrees, the hypotenuse 10 cm, and the side opposite the angle is x. Triangle B: the side opposite angle y is 6 cm and the side next to it is 8 cm.</title>
