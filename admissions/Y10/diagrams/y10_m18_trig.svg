  <path d="M 134.9 150 L 134.9 138 L 146.9 138" fill="none" stroke="#111" stroke-width="2"/>
  <path d="M 54 150 A 30 30 0 0 0 48.6 132.8" fill="none" stroke="#111" stroke-width="2"/>
  <text x="76" y="143" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="middle" fill="#111">35°</text>
  <text x="75.4" y="101" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="end" font-weight="700" fill="#111">10 cm</text>
  <text x="156.9" y="114" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="20" font-style="italic" fill="#111">x</text>
  <text x="85.4" y="182" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#111">A</text>
  <path d="M 234 150 L 354 150 L 354 60 Z" fill="#e6e6e6" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 342 150 L 342 138 L 354 138" fill="none" stroke="#111" stroke-width="2"/>
  <path d="M 264 150 A 30 30 0 0 0 258 132" fill="none" stroke="#111" stroke-width="2"/>
