<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 268" width="240" height="268">
  <title>A ladder leaning against a vertical wall. The ladder is 6.5 m long. The foot of the ladder is 2.5 m from the wall. The height up the wall is h.</title>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#111" stroke-width="1.5"/></pattern>
  </defs>
  <rect x="38" y="20" width="22" height="206" fill="url(#hatch)" stroke="none"/>
  <line x1="60" y1="20" x2="60" y2="226" stroke="#111" stroke-width="2.5"/>
  <rect x="38" y="226" width="195.0" height="14" fill="url(#hatch)" stroke="none"/>
  <line x1="38" y1="226" x2="233" y2="226" stroke="#111" stroke-width="2.5"/>
  <line x1="135.0" y1="226" x2="60" y2="46" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <line x1="135.0" y1="226" x2="60" y2="46" stroke="#e6e6e6" stroke-width="3" stroke-linecap="round"/>
  <path d="M 60 214 L 72 214 L 72 226" fill="none" stroke="#111" stroke-width="2"/>
  <text x="127.5" y="134" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" font-weight="700" fill="#111">6.5 m</text>
  <text x="97.5" y="260" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#111">2.5 m</text>
  <text x="70" y="196" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="20" font-style="italic" fill="#111">h</text>
  <text x="235" y="30" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="14" text-anchor="end" font-style="italic" fill="#111">Not drawn accurately</text>
  <text x="30" y="60" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="end" fill="#111">wall</text>
</svg>
