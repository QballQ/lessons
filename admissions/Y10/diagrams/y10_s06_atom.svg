<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 206" width="380" height="206">
  <title>A diagram of an atom. The nucleus has 3 protons and 4 neutrons. There are 3 electrons: 2 in the inner shell and 1 in the outer shell. A key shows the symbols.</title>
