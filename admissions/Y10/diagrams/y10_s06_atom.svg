  <text x="131" y="107.5" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#111">+</text>
  <circle cx="151" cy="104" r="12" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="121" cy="122" r="12" fill="#fff" stroke="#111" stroke-width="2"/>
