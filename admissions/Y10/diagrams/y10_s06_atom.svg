  <circle cx="272" cy="102" r="12" fill="#fff" stroke="#111" stroke-width="2"/><text x="294" y="108" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" fill="#111">neutron</text>
