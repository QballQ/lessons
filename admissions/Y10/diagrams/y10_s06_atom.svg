  <circle cx="81.5" cy="76" r="9" fill="#7a7a7a" stroke="#111" stroke-width="1.8"/><text x="81.5" y="81" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#fff">&#8722;</text>
  <circle cx="178.5" cy="132" r="9" fill="#7a7a7a" stroke="#111" stroke-width="1.8"/><text x="178.5" y="137" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#fff">&#8722;</text>
  <circle cx="176" cy="24.3" r="9" fill="#7a7a7a" stroke="#111" stroke-width="1.8"/><text x="176" y="29.3" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#fff">&#8722;</text>
