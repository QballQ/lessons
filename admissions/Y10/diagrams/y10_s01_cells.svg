<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 168" width="600" height="168">
  <title>Three specialised cells: A a red blood cell (a round disc with no nucleus), B a root hair cell (a cell with a long thin hair), C a nerve cell (a cell body with branches and a very long fibre).</title>
