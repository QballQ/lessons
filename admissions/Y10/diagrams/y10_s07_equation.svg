<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 160" width="380" height="160">
  <title>Particle picture of a reaction. On the left, two hydrogen molecules (each two H atoms) and one oxygen molecule (two O atoms). An arrow. On the right, two water molecules (each one O atom and two H atoms).</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/></marker>
  </defs>
  <circle cx="40" cy="40" r="13" fill="#fff" stroke="#111" stroke-width="2"/><text x="40" y="45.5" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#111">H</text><circle cx="64" cy="40" r="13" fill="#fff" stroke="#111" stroke-width="2"/><text x="64" y="45.5" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#111">H</text>
  <circle cx="40" cy="100" r="13" fill="#fff" stroke="#111" stroke-width="2"/><text x="40" y="105.5" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#111">H</text><circle cx="64" cy="100" r="13" fill="#fff" stroke="#111" stroke-width="2"/><text x="64" y="105.5" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#111">H</text>
  <text x="104" y="78" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="700" fill="#111">+</text>
  <circle cx="146" cy="70" r="18" fill="#bdbdbd" stroke="#111" stroke-width="2"/><text x="146" y="76" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#111">O</text><circle cx="178" cy="70" r="18" fill="#bdbdbd" stroke="#111" stroke-width="2"/><text x="178" y="76" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#111">O</text>
  <line x1="214" y1="70" x2="266" y2="70" stroke="#111" stroke-width="3" marker-end="url(#ah)"/>
  <circle cx="318" cy="40" r="18" fill="#bdbdbd" stroke="#111" stroke-width="2"/><text x="318" y="46" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#111">O</text><circle cx="296" cy="56" r="13" fill="#fff" stroke="#111" stroke-width="2"/><text x="296" y="61.5" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#111">H</text><circle cx="340" cy="56" r="13" fill="#fff" stroke="#111" stroke-width="2"/><text x="340" y="61.5" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#111">H</text>
  <circle cx="318" cy="104" r="18" fill="#bdbdbd" stroke="#111" stroke-width="2"/><text x="318" y="110" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#111">O</text><circle cx="296" cy="120" r="13" fill="#fff" stroke="#111" stroke-width="2"/><text x="296" y="125.5" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#111">H</text><circle cx="340" cy="120" r="13" fill="#fff" stroke="#111" stroke-width="2"/><text x="340" y="125.5" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#111">H</text>
  <text x="52" y="140" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="middle" fill="#111">hydrogen</text>
  <text x="162" y="140" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="middle" fill="#111">oxygen</text>
  <text x="318" y="152" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="middle" fill="#111">water</text>
</svg>
