<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 152" width="600" height="152">
  <title>Three clocks to choose from: A shows 8:45, B shows 8:30, C shows 9:00</title>
  <g transform="translate(0 0)" stroke="#111" stroke-width="2.5" stroke-linejoin="round">
    <rect x="30" y="20" width="130" height="74" rx="14" fill="#e6e6e6"/>
    <rect x="44" y="32" width="102" height="50" rx="6" fill="#fff"/>
    <rect x="48" y="94" width="16" height="8" rx="2" fill="#bdbdbd"/>
    <rect x="126" y="94" width="16" height="8" rx="2" fill="#bdbdbd"/>
    <rect x="84" y="13" width="22" height="7" rx="2" fill="#bdbdbd"/>
  </g>
  <text x="95" y="70" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="32" text-anchor="middle" font-weight="700" fill="#111">8:45</text>
  <g transform="translate(205 0)" stroke="#111" stroke-width="2.5" stroke-linejoin="round">
    <rect x="30" y="20" width="130" height="74" rx="14" fill="#e6e6e6"/>
    <rect x="44" y="32" width="102" height="50" rx="6" fill="#fff"/>
    <rect x="48" y="94" width="16" height="8" rx="2" fill="#bdbdbd"/>
    <rect x="126" y="94" width="16" height="8" rx="2" fill="#bdbdbd"/>
    <rect x="84" y="13" width="22" height="7" rx="2" fill="#bdbdbd"/>
  </g>
  <text x="300" y="70" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="32" text-anchor="middle" font-weight="700" fill="#111">8:30</text>
  <g transform="translate(410 0)" stroke="#111" stroke-width="2.5" stroke-linejoin="round">
    <rect x="30" y="20" width="130" height="74" rx="14" fill="#e6e6e6"/>
    <rect x="44" y="32" width="102" height="50" rx="6" fill="#fff"/>
    <rect x="48" y="94" width="16" height="8" rx="2" fill="#bdbdbd"/>
    <rect x="126" y="94" width="16" height="8" rx="2" fill="#bdbdbd"/>
    <rect x="84" y="13" width="22" height="7" rx="2" fill="#bdbdbd"/>
  </g>
  <text x="505" y="70" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="32" text-anchor="middle" font-weight="700" fill="#111">9:00</text>
  <rect x="1.5" y="1.5" width="187" height="112" rx="10" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="77" y="144" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="22" text-anchor="middle" font-weight="700" fill="#111">A</text>
  <rect x="97" y="125" width="26" height="26" rx="3" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="206.5" y="1.5" width="187" height="112" rx="10" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="282" y="144" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="22" text-anchor="middle" font-weight="700" fill="#111">B</text>
  <rect x="302" y="125" width="26" height="26" rx="3" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="411.5" y="1.5" width="187" height="112" rx="10" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="487" y="144" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="22" text-anchor="middle" font-weight="700" fill="#111">C</text>
