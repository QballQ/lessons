<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320">
  <title>A food web. Grass is eaten by grasshoppers and rabbits. Grasshoppers are eaten by frogs. Frogs and rabbits are eaten by snakes. Snakes and rabbits are eaten by hawks.</title>
