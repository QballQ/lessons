    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/></marker>
  </defs>
  <line x1="194.1" y1="275" x2="125.9" y2="235" stroke="#111" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="265.9" y1="275" x2="334.1" y2="235" stroke="#111" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="90" y1="193" x2="90" y2="145" stroke="#111" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="151" y1="124" x2="189" y2="124" stroke="#111" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="342" y1="193" x2="278" y2="145" stroke="#111" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="261.7" y1="103" x2="288.3" y2="55" stroke="#111" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="361.8" y1="193" x2="308.2" y2="55" stroke="#111" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="242.0" y="16.0" width="116" height="36" rx="8" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="300" y="40" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" text-anchor="middle" fill="#111">hawk</text>
  <rect x="32.0" y="106.0" width="116" height="36" rx="8" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="90" y="130" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" text-anchor="middle" fill="#111">frog</text>
  <rect x="192.0" y="106.0" width="116" height="36" rx="8" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="250" y="130" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" text-anchor="middle" fill="#111">snake</text>
  <rect x="32.0" y="196.0" width="116" height="36" rx="8" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="90" y="220" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" text-anchor="middle" fill="#111">grasshopper</text>
  <rect x="312.0" y="196.0" width="116" height="36" rx="8" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="370" y="220" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" text-anchor="middle" fill="#111">rabbit</text>
  <rect x="172.0" y="278.0" width="116" height="36" rx="8" fill="#e6e6e6" stroke="#111" stroke-width="2.5"/>
  <text x="230" y="302" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" text-anchor="middle" fill="#111">grass</text>
