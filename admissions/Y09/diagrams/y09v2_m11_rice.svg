    <text x="260" y="106" font-size="15">RICE</text>
    <text x="260" y="140" font-size="21" font-weight="700">2.5 kg</text>
    <text x="430" y="88" font-size="15">RICE</text>
    <text x="430" y="126" font-size="21" font-weight="700">5 kg</text>
    <text x="90" y="202" font-size="19" font-weight="700">¥13.80</text>
    <text x="260" y="202" font-size="19" font-weight="700">¥32.50</text>
    <text x="430" y="202" font-size="19" font-weight="700">¥66.00</text>
  </g>
