<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="380" height="230">
  <title>A diagram of an atom. The nucleus is labelled 9 protons and 10 neutrons. There are two electron shells: 2 electrons in the inner shell and 7 electrons in the outer shell. Electrons are drawn as crosses. A key says that a cross is an electron.</title>
  <circle cx="130" cy="115" r="58" fill="none" stroke="#111" stroke-width="1.8"/>
  <circle cx="130" cy="115" r="100" fill="none" stroke="#111" stroke-width="1.8"/>
  <circle cx="130" cy="115" r="34" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
  <g font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="14" font-weight="700" fill="#111" text-anchor="middle">
    <text x="130" y="112">9 p</text>
    <text x="130" y="130">10 n</text>
  </g>
  <!-- inner shell: 2 electrons at top and bottom -->
  <g font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#111" text-anchor="middle">
    <text x="130" y="65">×</text>
    <text x="130" y="181">×</text>
    <!-- outer shell: 7 electrons, radius 100, angles 90 (top), 141, 193, 244, 296, 347, 39 -->
    <text x="130" y="23">×</text>
    <text x="52" y="60">×</text>
    <text x="33" y="146">×</text>
    <text x="86" y="213">×</text>
    <text x="174" y="213">×</text>
    <text x="227" y="146">×</text>
    <text x="208" y="60">×</text>
  </g>
  <text x="262" y="100" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" font-weight="700" fill="#111">Key</text>
  <text x="262" y="128" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#111">×</text>
  <text x="284" y="126" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" fill="#111">electron</text>
  <text x="262" y="156" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" fill="#111">p = proton</text>
  <text x="262" y="180" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" fill="#111">n = neutron</text>
</svg>
