<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="500" height="230">
  <title>A transverse wave drawn as a smooth curve with two complete waves between 0 and 4 metres on a distance scale. The scale is marked 0, 1, 2, 3 and 4 m. The amplitude is marked as the distance from the centre line to a crest.</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/></marker>
  </defs>
  <!-- centre line -->
  <line x1="50" y1="100" x2="450" y2="100" stroke="#777" stroke-width="1.3" stroke-dasharray="6 5"/>
  <!-- wave: 2 wavelengths over 400 units (x 50 to 450), amplitude 50 -->
  <path d="M 50 100 C 70 100 85 50 100 50 C 115 50 135 150 150 150 C 165 150 185 50 200 50 C 215 50 235 150 250 150 C 265 150 285 50 300 50 C 315 50 335 150 350 150 C 365 150 385 50 400 50 C 415 50 430 100 450 100" fill="none" stroke="#111" stroke-width="3.2"/>
  <!-- amplitude marker at the crest x=100 -->
  <line x1="110" y1="100" x2="110" y2="50" stroke="#111" stroke-width="1.8" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text x="120" y="80" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" fill="#111">amplitude</text>
  <!-- distance scale -->
  <line x1="50" y1="186" x2="450" y2="186" stroke="#111" stroke-width="2"/>
  <g stroke="#111" stroke-width="2">
    <line x1="50" y1="178" x2="50" y2="194"/><line x1="150" y1="178" x2="150" y2="194"/><line x1="250" y1="178" x2="250" y2="194"/><line x1="350" y1="178" x2="350" y2="194"/><line x1="450" y1="178" x2="450" y2="194"/>
  </g>
  <g stroke="#111" stroke-width="1.2">
    <line x1="100" y1="181" x2="100" y2="191"/><line x1="200" y1="181" x2="200" y2="191"/><line x1="300" y1="181" x2="300" y2="191"/><line x1="400" y1="181" x2="400" y2="191"/>
  </g>
  <g font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" fill="#111" text-anchor="middle">
    <text x="50" y="214">0</text><text x="150" y="214">1</text><text x="250" y="214">2</text><text x="350" y="214">3</text><text x="450" y="214">4</text>
  </g>
  <text x="480" y="214" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" fill="#111" font-weight="700">m</text>
  <!-- light guide lines from scale to the wave start and end -->
  <line x1="50" y1="100" x2="50" y2="178" stroke="#bdbdbd" stroke-width="1"/>
  <line x1="450" y1="100" x2="450" y2="178" stroke="#bdbdbd" stroke-width="1"/>
</svg>
