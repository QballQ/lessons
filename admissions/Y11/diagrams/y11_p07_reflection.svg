<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" width="400" height="230">
  <title>A ray of light from a ray box hits a plane mirror and is reflected. The mirror is drawn as a horizontal line at the bottom with a hatched back. A dashed vertical line marks the normal at the point where the ray hits the mirror. The angle of incidence is between the incoming ray and the normal; the angle of reflection is between the normal and the reflected ray.</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#7a7a7a" stroke-width="2"/></pattern>
  </defs>
  <!-- mirror -->
  <rect x="60" y="170" width="300" height="12" fill="url(#hatch)" stroke="none"/>
  <line x1="60" y1="170" x2="360" y2="170" stroke="#111" stroke-width="3"/>
  <text x="372" y="182" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="14" fill="#111">mirror</text>
  <!-- normal -->
  <line x1="210" y1="170" x2="210" y2="30" stroke="#111" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="218" y="40" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="14" fill="#111">normal</text>
  <!-- ray box -->
  <rect x="40" y="38" width="46" height="30" fill="#bdbdbd" stroke="#111" stroke-width="1.8"/>
  <text x="63" y="30" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="13" fill="#111" text-anchor="middle">ray box</text>
  <!-- incident ray from (86,54) to (210,170); reflected ray is its mirror image -->
  <line x1="86" y1="54" x2="210" y2="170" stroke="#111" stroke-width="2.6" marker-end="url(#ah)"/>
  <!-- reflected ray, mirror image: to (334,54) -->
  <line x1="210" y1="170" x2="334" y2="54" stroke="#111" stroke-width="2.6" marker-end="url(#ah)"/>
  <!-- angle arcs -->
  <path d="M 210 120 A 50 50 0 0 0 173.5 135.8" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 210 120 A 50 50 0 0 1 246.5 135.8" fill="none" stroke="#111" stroke-width="1.5"/>
  <g font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" font-weight="700" fill="#111" text-anchor="middle">
    <text x="186" y="112">i</text>
    <text x="236" y="112">r</text>
  </g>
  <g font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="13" fill="#111">
    <text x="20" y="130">i = angle of incidence</text>
    <text x="20" y="148">r = angle of reflection</text>
  </g>
</svg>
