<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <title>A skateboarder stands at the top of a curved ramp. The height of the top of the ramp above the ground is marked 2 m. A label says mass 40 kg (skater and board). The ground continues flat to the right of the ramp.</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/></marker>
  </defs>
  <!-- ground -->
  <line x1="10" y1="190" x2="390" y2="190" stroke="#111" stroke-width="2.5"/>
  <!-- ramp -->
  <path d="M 40 190 L 40 70 L 70 70 Q 70 190 190 190 Z" fill="#e6e6e6" stroke="#111" stroke-width="2.4"/>
  <!-- skateboard -->
  <line x1="56" y1="66" x2="100" y2="66" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="70" r="4" fill="#111"/><circle cx="92" cy="70" r="4" fill="#111"/>
  <!-- skater -->
  <g stroke="#111" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="80" cy="16" r="8" fill="#fff"/>
    <line x1="80" y1="24" x2="78" y2="46"/>
    <line x1="78" y1="46" x2="66" y2="64"/>
    <line x1="78" y1="46" x2="92" y2="64"/>
    <line x1="80" y1="30" x2="62" y2="40"/>
    <line x1="80" y1="30" x2="98" y2="36"/>
  </g>
  <!-- height marker -->
  <line x1="24" y1="70" x2="24" y2="190" stroke="#111" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="18" y1="70" x2="40" y2="70" stroke="#111" stroke-width="1.2"/>
  <rect x="2" y="118" width="40" height="22" fill="#fff"/>
  <text x="22" y="135" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" font-weight="700" fill="#111" text-anchor="middle">2 m</text>
  <text x="250" y="90" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" fill="#111" text-anchor="middle">mass of skater and board = 40 kg</text>
  <text x="260" y="180" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" fill="#111" text-anchor="middle">bottom of ramp</text>
  <line x1="214" y1="183" x2="194" y2="189" stroke="#111" stroke-width="1.3"/>
  <text x="330" y="212" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="13" fill="#111" text-anchor="middle">Not drawn to scale</text>
</svg>
