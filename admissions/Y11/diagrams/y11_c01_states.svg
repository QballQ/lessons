<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200">
  <title>Three boxes of particles labelled A, B and C. In A the particles are in neat rows and touching. In B the particles are touching but not in rows. In C there are only a few particles, far apart, with short arrows showing movement.</title>
  <g fill="none" stroke="#111" stroke-width="2.4">
    <rect x="20" y="20" width="140" height="140"/>
    <rect x="210" y="20" width="140" height="140"/>
    <rect x="400" y="20" width="140" height="140"/>
  </g>
  <!-- A: solid lattice 5 x 5, r 13, spacing 27 -->
  <g fill="#bdbdbd" stroke="#111" stroke-width="1.6">
    <circle cx="36" cy="36" r="13"/><circle cx="63" cy="36" r="13"/><circle cx="90" cy="36" r="13"/><circle cx="117" cy="36" r="13"/><circle cx="144" cy="36" r="13"/>
    <circle cx="36" cy="63" r="13"/><circle cx="63" cy="63" r="13"/><circle cx="90" cy="63" r="13"/><circle cx="117" cy="63" r="13"/><circle cx="144" cy="63" r="13"/>
    <circle cx="36" cy="90" r="13"/><circle cx="63" cy="90" r="13"/><circle cx="90" cy="90" r="13"/><circle cx="117" cy="90" r="13"/><circle cx="144" cy="90" r="13"/>
    <circle cx="36" cy="117" r="13"/><circle cx="63" cy="117" r="13"/><circle cx="90" cy="117" r="13"/><circle cx="117" cy="117" r="13"/><circle cx="144" cy="117" r="13"/>
    <circle cx="36" cy="144" r="13"/><circle cx="63" cy="144" r="13"/><circle cx="90" cy="144" r="13"/><circle cx="117" cy="144" r="13"/><circle cx="144" cy="144" r="13"/>
  </g>
  <!-- B: liquid, close but irregular -->
  <g fill="#bdbdbd" stroke="#111" stroke-width="1.6">
    <circle cx="228" cy="146" r="13"/><circle cx="255" cy="142" r="13"/><circle cx="282" cy="147" r="13"/><circle cx="309" cy="141" r="13"/><circle cx="336" cy="146" r="13"/>
    <circle cx="240" cy="121" r="13"/><circle cx="268" cy="118" r="13"/><circle cx="296" cy="122" r="13"/><circle cx="324" cy="117" r="13"/>
    <circle cx="228" cy="96" r="13"/><circle cx="256" cy="93" r="13"/><circle cx="284" cy="98" r="13"/><circle cx="312" cy="92" r="13"/><circle cx="338" cy="94" r="13"/>
    <circle cx="246" cy="70" r="13"/><circle cx="274" cy="72" r="13"/><circle cx="302" cy="68" r="13"/><circle cx="330" cy="70" r="13"/>
    <circle cx="232" cy="47" r="13"/><circle cx="262" cy="46" r="13"/><circle cx="292" cy="44" r="13"/><circle cx="320" cy="46" r="13"/>
  </g>
  <!-- C: gas, few, far apart, with arrows -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/></marker>
  </defs>
  <g fill="#bdbdbd" stroke="#111" stroke-width="1.6">
    <circle cx="430" cy="50" r="13"/><circle cx="505" cy="40" r="13"/><circle cx="470" cy="95" r="13"/>
    <circle cx="425" cy="135" r="13"/><circle cx="515" cy="125" r="13"/>
  </g>
  <g stroke="#111" stroke-width="1.8" fill="none" marker-end="url(#ah)">
    <line x1="443" y1="58" x2="462" y2="72"/>
    <line x1="492" y1="48" x2="470" y2="60"/>
    <line x1="480" y1="105" x2="496" y2="118"/>
    <line x1="438" y1="130" x2="458" y2="122"/>
    <line x1="508" y1="113" x2="500" y2="92"/>
  </g>
  <g font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#111" text-anchor="middle">
    <text x="90" y="190">A</text>
    <text x="280" y="190">B</text>
    <text x="470" y="190">C</text>
  </g>
</svg>
