<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="420" height="250">
  <title>A plant cell. Five parts are labelled with letters: A the cell wall (the thick outer layer), B the cell membrane (the thin line inside the wall), C the nucleus (a round body with a dot), D a chloroplast (one of several grey ovals), E the vacuole (the large central space).</title>
  <!-- cell wall and membrane -->
  <rect x="60" y="30" width="250" height="190" rx="26" fill="#e6e6e6" stroke="#111" stroke-width="7"/>
  <rect x="70" y="40" width="230" height="170" rx="20" fill="#fff" stroke="#111" stroke-width="2"/>
  <!-- vacuole -->
  <path d="M 110 95 Q 130 70 185 72 Q 250 70 268 110 Q 282 150 250 182 Q 200 200 150 186 Q 100 170 110 95 Z" fill="#f4f4f4" stroke="#111" stroke-width="1.8" stroke-dasharray="6 4"/>
  <!-- nucleus -->
  <circle cx="110" cy="170" r="22" fill="#bdbdbd" stroke="#111" stroke-width="2"/>
  <circle cx="110" cy="170" r="6" fill="#111"/>
  <!-- chloroplasts -->
  <g fill="#7a7a7a" stroke="#111" stroke-width="1.8">
    <ellipse cx="95" cy="70" rx="15" ry="9" transform="rotate(-20 95 70)"/>
    <ellipse cx="150" cy="55" rx="15" ry="9" transform="rotate(10 150 55)"/>
    <ellipse cx="270" cy="60" rx="15" ry="9" transform="rotate(-30 270 60)"/>
    <ellipse cx="283" cy="190" rx="15" ry="9" transform="rotate(30 283 190)"/>
    <ellipse cx="200" cy="200" rx="15" ry="9" transform="rotate(-10 200 200)"/>
  </g>
  <!-- labels -->
  <g font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="20" font-weight="700" fill="#111">
    <text x="22" y="47">A</text>
    <text x="22" y="100">B</text>
    <text x="22" y="178">C</text>
    <text x="370" y="60">D</text>
    <text x="370" y="135">E</text>
  </g>
  <g stroke="#111" stroke-width="1.6" fill="none">
    <line x1="42" y1="40" x2="62" y2="48"/>
    <line x1="42" y1="94" x2="71" y2="100"/>
    <line x1="42" y1="172" x2="88" y2="170"/>
    <line x1="366" y1="54" x2="284" y2="60"/>
    <line x1="366" y1="130" x2="262" y2="130"/>
  </g>
</svg>
