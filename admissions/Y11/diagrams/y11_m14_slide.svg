<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240">
  <title>A water slide drawn as a right-angled triangle. The slide is the sloping side, from a platform at the top down to a pool at the bottom. The vertical height from the ground to the top of the slide is 9 m. The slide makes an angle of 32 degrees with the ground. The length of the slide is marked L. There is a right angle at the foot of the vertical. Not drawn accurately.</title>
  <line x1="20" y1="200" x2="400" y2="200" stroke="#111" stroke-width="2.5"/>
  <path d="M 300 200 L 300 40 L 60 200 Z" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <line x1="300" y1="40" x2="60" y2="200" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <rect x="300" y="28" width="60" height="12" fill="#bdbdbd" stroke="#111" stroke-width="2"/>
  <path d="M 300 40 L 300 200 M 320 40 L 320 200 M 340 40 L 340 200" stroke="#111" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M 24 206 q 8 -5 16 0 t 16 0 t 16 0 t 16 0 t 16 0" fill="none" stroke="#111" stroke-width="1.6"/>
  <path d="M 288 200 L 288 188 L 300 188" fill="none" stroke="#111" stroke-width="1.8"/>
  <path d="M 120 200 A 60 60 0 0 0 110.9 168.2" fill="none" stroke="#111" stroke-width="1.8"/>
  <text x="130" y="192" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#111">32°</text>
  <text x="160" y="106" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="700" font-style="italic" fill="#111">L</text>
  <text x="312" y="128" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#111">9 m</text>
  <text x="330" y="22" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="14" text-anchor="middle" fill="#111">platform</text>
  <text x="44" y="226" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="14" text-anchor="middle" fill="#111">pool</text>
  <text x="8" y="18" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="14" text-anchor="start" font-style="italic" fill="#111">Not drawn accurately</text>
</svg>
