  <title>A web page of Sunrise Community Centre: Summer workshops for ages 12 to 18. A table lists five workshops with the day and time, ages, price and places: Photography, Monday 9:30 to 12:00, ages 12 and over, 80 yuan, full; Baking, Tuesday 14:00 to 16:30, ages 12 and over, 60 yuan, 4 places left; Robotics, Wednesday 10:00 to 12:30, ages 14 and over, free, 6 places left; Drama, Thursday 14:00 to 17:00, ages 12 and over, 50 yuan, 10 places left; First aid, Friday 9:00 to 12:00, ages 15 and over, free, 8 places left. Notes: book online by Friday 20 June and pay when you book; students with a student card pay half price; for Photography bring your own camera or borrow one from the centre for 20 yuan; if a workshop is full, add your name to the waiting list and the centre will email you if a place becomes free; all workshops are taught in English.</title>
