<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" width="640" height="150">
  <title>A pH scale from 0 to 14 drawn as a row of 15 boxes. Four solutions are marked with arrows: A at pH 1, B at pH 4, C at pH 7 and D at pH 13. The words acid, neutral and alkali are printed under the scale.</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#bdbdbd" stroke-width="2"/></pattern>
  </defs>
  <!-- boxes: pH n at x = 20 + 40*n, width 40 -->
  <g stroke="#111" stroke-width="1.6">
    <rect x="20" y="70" width="40" height="36" fill="#7a7a7a"/><rect x="60" y="70" width="40" height="36" fill="#7a7a7a"/><rect x="100" y="70" width="40" height="36" fill="#bdbdbd"/>
    <rect x="140" y="70" width="40" height="36" fill="#bdbdbd"/><rect x="180" y="70" width="40" height="36" fill="#e6e6e6"/><rect x="220" y="70" width="40" height="36" fill="#e6e6e6"/>
    <rect x="260" y="70" width="40" height="36" fill="#f4f4f4"/><rect x="300" y="70" width="40" height="36" fill="#fff"/><rect x="340" y="70" width="40" height="36" fill="#f4f4f4"/>
    <rect x="380" y="70" width="40" height="36" fill="url(#hatch)"/><rect x="420" y="70" width="40" height="36" fill="url(#hatch)"/><rect x="460" y="70" width="40" height="36" fill="url(#hatch)"/>
    <rect x="500" y="70" width="40" height="36" fill="url(#hatch)"/><rect x="540" y="70" width="40" height="36" fill="url(#hatch)"/><rect x="580" y="70" width="40" height="36" fill="url(#hatch)"/>
  </g>
  <g font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" font-weight="700" fill="#111" text-anchor="middle">
    <text x="40" y="94" fill="#fff">0</text><text x="80" y="94" fill="#fff">1</text><text x="120" y="94">2</text><text x="160" y="94">3</text><text x="200" y="94">4</text>
    <text x="240" y="94">5</text><text x="280" y="94">6</text><text x="320" y="94">7</text><text x="360" y="94">8</text><text x="400" y="94">9</text>
    <text x="440" y="94">10</text><text x="480" y="94">11</text><text x="520" y="94">12</text><text x="560" y="94">13</text><text x="600" y="94">14</text>
  </g>
  <g font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" fill="#111" text-anchor="middle">
    <text x="160" y="132">acid</text>
    <text x="320" y="132">neutral</text>
    <text x="500" y="132">alkali</text>
  </g>
  <!-- solution arrows -->
  <g stroke="#111" stroke-width="2" marker-end="url(#ah)">
    <line x1="80" y1="36" x2="80" y2="66"/>
    <line x1="200" y1="36" x2="200" y2="66"/>
    <line x1="320" y1="36" x2="320" y2="66"/>
    <line x1="560" y1="36" x2="560" y2="66"/>
  </g>
  <g font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" font-weight="700" fill="#111" text-anchor="middle">
    <text x="80" y="26">A</text>
    <text x="200" y="26">B</text>
    <text x="320" y="26">C</text>
    <text x="560" y="26">D</text>
  </g>
</svg>
