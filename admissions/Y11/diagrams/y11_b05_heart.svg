<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" width="380" height="300">
  <title>A simple diagram of the human heart seen from the front, with four chambers labelled. A is the upper chamber on the left of the diagram, B is the lower chamber on the left of the diagram, C is the upper chamber on the right of the diagram, D is the lower chamber on the right of the diagram, which has a thick muscular wall. Three blood vessels leave the top of the heart. Valves are drawn between the upper and lower chambers.</title>
  <!-- vessels -->
  <g fill="#fff" stroke="#111" stroke-width="2.4">
    <path d="M 102 70 L 102 14 L 130 14 L 130 70"/>
    <path d="M 170 62 L 170 36 Q 170 10 196 10 L 240 10 L 240 28 L 196 28 Q 190 28 190 36 L 190 62"/>
    <path d="M 250 70 L 250 20 L 278 20 L 278 70"/>
  </g>
  <!-- outline -->
  <path d="M 70 90 C 70 42 150 36 180 70 C 210 36 300 42 300 95 L 300 150 C 300 215 250 262 190 290 C 125 255 70 205 70 150 Z" fill="#f4f4f4" stroke="#111" stroke-width="3"/>
  <!-- thick left ventricle wall -->
  <path d="M 300 150 C 300 215 250 262 190 290 L 196 270 C 246 240 282 200 282 150 Z" fill="#bdbdbd" stroke="#111" stroke-width="1.6"/>
  <path d="M 190 290 L 196 270 L 180 252 L 182 290 Z" fill="#bdbdbd" stroke="#111" stroke-width="1.6"/>
  <!-- septum -->
  <path d="M 180 70 L 180 252 L 190 290" fill="none" stroke="#111" stroke-width="7"/>
  <!-- atrium / ventricle boundaries with valves -->
  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="70" y1="135" x2="108" y2="135"/>
    <line x1="146" y1="135" x2="180" y2="135"/>
    <path d="M 108 135 L 118 150 M 146 135 L 136 150"/>
    <line x1="180" y1="135" x2="218" y2="135"/>
    <line x1="256" y1="135" x2="300" y2="135"/>
    <path d="M 218 135 L 228 150 M 256 135 L 246 150"/>
  </g>
  <g font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#111" text-anchor="middle">
    <text x="125" y="112">A</text>
    <text x="128" y="210">B</text>
    <text x="240" y="112">C</text>
    <text x="232" y="210">D</text>
  </g>
  <text x="330" y="226" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="14" fill="#111">thick</text>
  <text x="330" y="243" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="14" fill="#111">wall</text>
  <line x1="326" y1="232" x2="292" y2="212" stroke="#111" stroke-width="1.4"/>
</svg>
