  <text x="300" y="150" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="15" fill="#111">clamp</text>
  <line x1="296" y1="146" x2="196" y2="92" stroke="#111" stroke-width="1.2"/>
</svg>
