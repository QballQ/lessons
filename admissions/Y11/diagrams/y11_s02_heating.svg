<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" width="400" height="230">
  <title>A boiling tube held at an angle in a clamp, with white powder labelled calcium carbonate at its closed end. A Bunsen burner flame heats the end of the tube. Gas leaves the open end of the tube, shown by three small arrows labelled carbon dioxide.</title>
