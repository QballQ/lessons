<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 0 424 250" width="424" height="250">
  <title>A small model of a water tower and the real water tower. The model is 30 cm tall and holds 0.5 litres. The real tower is 12 m tall. Both have a tank on top of a tall frame. Not drawn accurately.</title>
  <g stroke="#111" stroke-width="2.2" stroke-linejoin="round">
    <path d="M 68 150 L 72 200 L 108 200 L 112 150 Z" fill="#e6e6e6"/>
    <path d="M 90 170 L 84 200 M 90 170 L 96 200" fill="none" stroke-width="1.5"/>
    <path d="M 62 150 L 118 150 L 112 124 L 68 124 Z" fill="#bdbdbd"/>
    <path d="M 72 124 Q 90 116 108 124" fill="#fff"/>
    <path d="M 60 200 L 120 200" stroke-width="2"/>
  </g>
  <line x1="40" y1="124" x2="40" y2="200" stroke="#111" stroke-width="1.8"/>
  <path d="M 35 133 L 40 124 L 45 133 M 35 191 L 40 200 L 45 191" fill="none" stroke="#111" stroke-width="1.8"/>
  <line x1="36" y1="124" x2="66" y2="124" stroke="#111" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="34" y="166" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="end" font-weight="700" fill="#111">30 cm</text>
  <text x="90" y="226" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#111">Model: holds 0.5 litres</text>
  <g stroke="#111" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 252 86 L 236 200 L 344 200 L 328 86 Z" fill="#e6e6e6"/>
    <path d="M 252 86 L 344 200 M 328 86 L 236 200 M 246 130 L 334 130 M 241 165 L 339 165" fill="none" stroke-width="1.5"/>
    <path d="M 226 86 L 354 86 L 340 30 L 240 30 Z" fill="#bdbdbd"/>
    <path d="M 246 30 Q 290 12 334 30" fill="#fff"/>
    <path d="M 220 200 L 360 200" stroke-width="2"/>
  </g>
  <line x1="198" y1="30" x2="198" y2="200" stroke="#111" stroke-width="1.8"/>
  <path d="M 193 39 L 198 30 L 203 39 M 193 191 L 198 200 L 203 191" fill="none" stroke="#111" stroke-width="1.8"/>
  <line x1="194" y1="30" x2="238" y2="30" stroke="#111" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="192" y="120" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="end" font-weight="700" fill="#111">12 m</text>
  <text x="290" y="226" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#111">Real tower: holds ? litres</text>
  <text x="-16" y="18" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="14" text-anchor="start" font-style="italic" fill="#111">Not drawn accurately</text>
</svg>
