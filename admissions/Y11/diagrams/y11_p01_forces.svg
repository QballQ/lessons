<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" width="360" height="140">
  <title>A box on a floor. An arrow pointing to the right is labelled 30 N. A shorter arrow pointing to the left is labelled 10 N.</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/></marker>
  </defs>
  <line x1="10" y1="110" x2="350" y2="110" stroke="#111" stroke-width="2.5"/>
  <rect x="140" y="40" width="80" height="70" fill="#e6e6e6" stroke="#111" stroke-width="2.4"/>
  <line x1="220" y1="75" x2="320" y2="75" stroke="#111" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="140" y1="75" x2="100" y2="75" stroke="#111" stroke-width="3" marker-end="url(#ah)"/>
  <text x="270" y="62" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#111">30 N</text>
  <text x="112" y="62" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#111">10 N</text>
  <text x="180" y="132" font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="13" fill="#111" text-anchor="middle">Not drawn to scale</text>
</svg>
