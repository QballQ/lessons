<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <title>A dot-and-cross diagram of a methane molecule. A carbon atom in the centre has an outer shell drawn as a circle. Four hydrogen atoms are drawn as smaller circles overlapping the carbon shell at the top, bottom, left and right. Each overlap contains one dot and one cross, showing a shared pair of electrons.</title>
  <circle cx="130" cy="130" r="62" fill="none" stroke="#111" stroke-width="2"/>
  <g fill="none" stroke="#111" stroke-width="2">
    <circle cx="130" cy="52" r="30"/>
    <circle cx="130" cy="208" r="30"/>
    <circle cx="52" cy="130" r="30"/>
    <circle cx="208" cy="130" r="30"/>
  </g>
  <g font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#111" text-anchor="middle">
    <text x="130" y="138">C</text>
    <text x="130" y="36">H</text>
    <text x="130" y="228">H</text>
    <text x="36" y="138">H</text>
    <text x="224" y="138">H</text>
  </g>
  <!-- shared pairs: dot (carbon) and cross (hydrogen) in each overlap -->
  <g fill="#111">
    <circle cx="121" cy="72" r="4"/><circle cx="121" cy="188" r="4"/><circle cx="72" cy="139" r="4"/><circle cx="188" cy="139" r="4"/>
  </g>
  <g font-family="Atkinson Hyperlegible, Noto Sans, sans-serif" font-size="20" font-weight="700" fill="#111" text-anchor="middle">
    <text x="140" y="79">×</text>
    <text x="140" y="195">×</text>
    <text x="72" y="131">×</text>
    <text x="188" y="131">×</text>
  </g>
</svg>
